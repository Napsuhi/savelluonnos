<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sävelluonnos</title>
<style>
  :root{
    --bg:#0E1116;
    --panel:#171B22;
    --line:#232A34;
    --key:#D8DEE6;
    --key-on:#F2C14E;
    --tonic:#6FD3C0;
    --rec:#E5484D;
    --rest:#5C6675;
    --range:#1D3A38;
    --bar:#8A7BFF;
    --ink:#0E1116;
    --text:#8D97A5;
    --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;margin:0;overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:var(--mono);
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  body{
    display:flex;flex-direction:column;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  select,button{
    font-family:var(--mono);
    background:#0B0E12;color:var(--key);
    border:1px solid var(--line);border-radius:5px;
    padding:5px 7px;font-size:12px;
  }
  select{appearance:none;-webkit-appearance:none;min-width:0;}
  button{cursor:pointer;white-space:nowrap;}
  button:disabled{opacity:.3;cursor:default;}
  select:focus-visible,button:focus-visible{outline:2px solid var(--tonic);outline-offset:1px;}

  #bar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:5px 8px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  #bar label{
    position:relative;
    display:flex;align-items:center;gap:4px;
    font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    white-space:nowrap;min-width:0;
  }
  #scale{max-width:150px;text-overflow:ellipsis;}
  #bar select{padding-right:20px;}
  #bar label::after{
    content:"";position:absolute;right:7px;top:50%;
    width:0;height:0;margin-top:-1px;pointer-events:none;
    border-left:4px solid transparent;
    border-right:4px solid transparent;
    border-top:5px solid var(--text);
  }
  #rec{
    margin-left:auto;
    border-color:var(--rec);color:var(--rec);
    font-weight:600;letter-spacing:.06em;
    display:flex;align-items:center;gap:6px;
  }
  #rec::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rec);}
  #rec.armed{background:var(--rec);color:#fff;border-color:var(--rec);}
  #rec.armed::before{background:#fff;border-color:#fff;}

  #midrow{
    flex:0 0 auto;
    display:flex;align-items:stretch;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  #midrow button{
    flex:0 0 auto;border:none;border-radius:0;background:transparent;
    padding:6px 0;font-size:14px;line-height:1;color:var(--key);
  }
  #midrow button:active:not(:disabled){background:var(--line);}
  #octbox,#tempobox{display:flex;align-items:stretch;min-width:0;}
  #octbox{flex:1 1 58%;border-right:1px solid var(--line);}
  #tempobox{flex:1 1 42%;}
  #octdown,#octup{width:58px;text-align:center;font-size:11px;letter-spacing:.03em;}
  #bpmdown,#bpmup{width:32px;text-align:center;font-size:15px;}
  #octnow{
    flex:1 1 auto;min-width:0;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:12px;letter-spacing:.06em;color:var(--key);
  }
  #octnow b{font-weight:400;opacity:.45;}
  #octnow b.low{opacity:1;color:var(--tonic);}
  #kick{
    flex:0 0 auto;width:54px;
    font-size:10px;letter-spacing:.05em;
    color:var(--text);
    border-left:1px solid var(--line);
  }
  #kick.on{color:var(--key-on);}
  #bpmnow{
    flex:0 0 auto;width:40px;text-align:center;
    font-size:12px;color:var(--key);
    border-bottom:1px dotted #3A4A5E;   /* vihje: tähän voi napauttaa tempon */
  }
  #bpmnow.tapping{color:var(--key-on);border-bottom-color:var(--key-on);}

  #trackrow{
    flex:0 0 auto;
    display:flex;align-items:stretch;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  #tabs{flex:1 1 auto;display:flex;align-items:stretch;min-width:0;}
  #tabs button{
    flex:1 1 0;min-width:0;
    border:none;border-radius:0;background:transparent;
    padding:5px 1px;font-size:10px;line-height:1.25;
    color:var(--text);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:1px;
    overflow:hidden;
  }
  #tabs button b{font-weight:600;}
  #tabs button span{font-size:9px;opacity:.5;}
  #tabs button.on{background:#0B0E12;color:var(--tonic);}
  #tabs button.on span{opacity:.7;}
  #mixbtn,#savebtn,#lanesbtn,#findbtn{
    flex:0 0 37px;border:none;border-radius:0;background:transparent;
    color:var(--text);font-size:9px;letter-spacing:.02em;
    border-left:1px solid var(--line);
  }
  #mixbtn.on,#savebtn.on,#lanesbtn.on,#findbtn.on{background:#0B0E12;color:var(--tonic);}

  #strip{
    flex:0 0 auto;display:none;flex-direction:column;
    background:#0B0E12;
    border-bottom:1px solid var(--line);
  }
  #strip.show{display:flex;}

  #striptop{
    display:flex;align-items:stretch;gap:8px;
    padding:5px 8px 0;height:48px;
  }
  #count{
    flex:0 0 auto;align-self:center;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    font-size:10px;letter-spacing:.06em;color:var(--text);
  }
  #count .bars{opacity:.55;}
  #notes{
    flex:1 1 auto;min-width:0;
    display:flex;align-items:stretch;gap:2px;
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;
  }
  #notes::-webkit-scrollbar{display:none;}
  #notes span.note{
    flex:0 0 auto;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;
    padding:0 6px;border-radius:5px;
    color:var(--key);cursor:pointer;
  }
  #notes span.note em{font-style:normal;font-size:14px;line-height:1;}
  #notes span.note i{font-style:normal;font-size:9px;line-height:1;opacity:.4;letter-spacing:.04em;}
  #notes span.note.rest em{color:var(--rest);}
  #notes span.note.range{background:var(--range);}
  #notes span.note.sel{background:var(--line);color:var(--key-on);}
  #notes span.note.sel i{opacity:.85;}
  #notes span.note.playing em{color:var(--key-on);}
  /* Tahtiviiva on rakenteen mittatikku, joten sen pitää erottua nuoteista
     ilman että se sekoittuu kohdistimeen tai valintaan. */
  #notes b.barline{
    flex:0 0 auto;width:3px;align-self:stretch;
    margin:0 4px;border-radius:2px;
    background:var(--bar);
  }
  #notes b.caret{
    flex:0 0 auto;width:2px;align-self:stretch;
    margin:4px 0;border-radius:1px;
    background:var(--tonic);
  }

  .btnrow{display:flex;align-items:center;gap:5px;padding:5px 8px 0;}
  .btnrow:last-child{padding-bottom:6px;}
  .btnrow button{padding:6px 5px;font-size:12px;flex:1 1 0;}
  #prev,#next,#shorter,#longer,#down,#up,#play,#playhere,#loop{flex:0 0 42px;text-align:center;font-size:14px;line-height:1;}
  #prev,#next{border-color:#3A4A5E;font-size:12px;}
  #shorter,#longer{font-size:13px;}
  .btnrow.wide button{font-size:11px;padding:6px 2px;}
  #down,#up{border-color:#3A4A5E;}
  #loop{border-color:#3A4A5E;font-size:16px;}
  #loop.on{border-color:var(--key-on);color:var(--key-on);}
  #play.on,#playhere.on{border-color:var(--key-on);color:var(--key-on);}
  #playhere{border-color:#3A4A5E;}
  #rest{border-color:var(--rest);}
  #select.on{border-color:var(--tonic);color:var(--tonic);}
  #mode{flex:0 0 86px;}
  #mode.all{border-color:var(--tonic);color:var(--tonic);}
  #export{border-color:var(--tonic);color:var(--tonic);font-weight:600;}
  #export:disabled{border-color:var(--line);color:var(--key);}

  /* ---- mikseri: korvaa koskettimiston kun avataan ---- */
  #mixer{
    flex:1 1 auto;min-height:0;display:none;
    flex-direction:column;justify-content:center;gap:9px;
    padding:10px 14px;overflow-y:auto;
  }
  #mixer.show{display:flex;}
  .mixblock{display:flex;flex-direction:column;gap:3px;}
  .mixhead{display:flex;align-items:center;gap:9px;}
  .mixhead b{flex:0 0 22px;font-weight:600;font-size:12px;color:var(--text);}
  .mixmute{flex:0 0 38px;padding:8px 0;text-align:center;font-size:11px;font-weight:600;}
  .mixmute.on{border-color:var(--rec);color:var(--rec);}
  .selwrap{position:relative;flex:1 1 auto;min-width:0;display:flex;}
  .selwrap select{
    flex:1 1 auto;min-width:0;
    font-size:13px;padding:8px 30px 8px 10px;
    border-color:#3A4A5E;color:var(--tonic);
  }
  .selwrap::after{
    content:"";position:absolute;right:11px;top:50%;
    width:0;height:0;margin-top:-2px;pointer-events:none;
    border-left:5px solid transparent;
    border-right:5px solid transparent;
    border-top:6px solid var(--tonic);
  }
  .mixrow{display:flex;align-items:center;gap:10px;padding-left:31px;}
  .mixrow b{flex:0 0 62px;font-weight:600;font-size:12px;color:var(--key);}
  .mixrow input{flex:1 1 auto;min-width:0;accent-color:var(--tonic);height:24px;}
  .mixrow span{flex:0 0 44px;text-align:right;font-size:11px;color:var(--text);}
  #mixhint{font-size:10px;line-height:1.4;opacity:.5;padding-top:2px;}

  /* ---- otospaneeli ---- */
  #savepanel{
    flex:1 1 auto;min-height:0;display:none;
    flex-direction:column;padding:10px 12px;gap:8px;
  }
  #savepanel.show{display:flex;}
  #savenow{flex:0 0 auto;padding:9px;font-size:12px;border-color:var(--tonic);color:var(--tonic);font-weight:600;}
  #savelist{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
  .saverow{
    display:flex;align-items:center;gap:8px;
    background:#0B0E12;border:1px solid var(--line);border-radius:6px;
    padding:7px 9px;
  }
  .saverow div{flex:1 1 auto;min-width:0;}
  .saverow .when{font-size:12px;color:var(--key);line-height:1.3;}
  .saverow .what{font-size:10px;color:var(--text);line-height:1.3;}
  .saverow button{flex:0 0 auto;padding:6px 9px;font-size:11px;}
  .saverow .drop{border-color:var(--rec);color:var(--rec);}
  #saveempty{font-size:11px;opacity:.5;line-height:1.5;padding:6px 2px;}

  /* ---- sävellajin etsin ---- */
  #finder{
    flex:1 1 auto;min-height:0;display:none;
    flex-direction:column;gap:7px;padding:8px 10px;
  }
  #finder.show{display:flex;}
  .findlbl{font-size:9px;letter-spacing:.09em;text-transform:uppercase;opacity:.55;}
  #roots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
  #roots button{padding:9px 0;font-size:13px;}
  #roots button.on{border-color:var(--tonic);color:var(--tonic);background:#0F1A1C;}
  #scalelist{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    display:grid;grid-template-columns:repeat(2,1fr);gap:4px;
    align-content:start;scrollbar-width:none;
  }
  #scalelist::-webkit-scrollbar{display:none;}
  #scalelist button{padding:8px 4px;font-size:11px;text-align:left;overflow:hidden;}
  #scalelist button.on{border-color:var(--tonic);color:var(--tonic);background:#0F1A1C;}
  #findrow{display:flex;gap:5px;}
  #findrow button{flex:1 1 0;padding:9px 2px;font-size:11px;}
  #drone.on{border-color:var(--key-on);color:var(--key-on);}
  #apply{border-color:var(--tonic);color:var(--tonic);font-weight:600;}
  #findhint{font-size:9px;line-height:1.45;opacity:.45;}
  .findhead{display:flex;align-items:center;gap:8px;}
  .findhead .findlbl{flex:1 1 auto;}
  .findhead button{flex:0 0 auto;padding:3px 7px;font-size:9px;}
  #sieve{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
  #sieve button{
    padding:6px 0;font-size:12px;line-height:1;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  #sieve button i{font-style:normal;font-size:9px;opacity:.45;}
  #sieve button.yes i,#sieve button.no i{opacity:.8;}
  #sieve button.yes{border-color:var(--tonic);color:var(--tonic);background:#0F1A1C;}
  #sieve button.no{border-color:var(--rec);color:var(--rec);background:#1A0F11;}
  #scalelist button.out{opacity:.28;}
  #finder .mixrow{padding-left:0;}
  #finder .mixrow b{flex:0 0 46px;font-size:11px;}

  /* ---- raitojen yhteisnäkymä ----
     Kaikki neljä raitaa samalla aika-akselilla: nuotin leveys on suoraan
     verrannollinen kestoon ja rivit alkavat samasta kohdasta, joten
     päällekkäisyydet näkyvät sellaisinaan. Tahtiruudukko piirretään
     taustaan, jolloin se on absoluuttista aikaa eikä raidan omaa summaa. */
  #lanes{
    flex:1 1 auto;min-height:0;display:none;
    flex-direction:column;gap:4px;padding:5px 6px;
  }
  #lanes.show{display:flex;}
  .lane{flex:1 1 0;min-height:0;display:flex;align-items:stretch;gap:6px;}
  .lane .lbl{
    flex:0 0 58px;min-width:0;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    font-size:10px;line-height:1.3;color:var(--text);
  }
  .lane .lbl i{font-style:normal;opacity:.5;font-size:9px;}
  .lane.on .lbl{color:var(--tonic);}
  .lane .track{
    flex:1 1 auto;min-width:0;
    overflow-x:auto;overflow-y:hidden;
    background:#0B0E12;border:1px solid #161C24;border-radius:5px;
    scrollbar-width:none;
  }
  .lane .track::-webkit-scrollbar{display:none;}
  .lane.on .track{border-color:#2A3B49;}
  .lane .inner{position:relative;height:100%;}
  .lane .nb{
    position:absolute;top:5px;bottom:5px;
    border-radius:3px;background:var(--key);color:var(--ink);
    font-size:10px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .lane .nb.rest{background:#1B222C;}
  .lane .nb.cur{box-shadow:0 0 0 2px var(--key-on);}
  .lane .cursorline{
    position:absolute;top:2px;bottom:2px;width:2px;
    background:var(--tonic);border-radius:1px;
  }

  /* ---- nauhoituksen reunavalo ----
     Kiinteä kehys ruudun reunoilla. Hidas hengittävä sykintä: näkyy
     selvästi silmäkulmasta, mutta ei vilku eikä vie huomiota soitolta. */
  #recglow{
    position:fixed;inset:0;z-index:50;
    pointer-events:none;display:none;
    border:3px solid var(--rec);
    opacity:0;
  }
  body.rec #recglow{
    display:block;
    animation:recpulse 2.4s ease-in-out infinite;
  }
  @keyframes recpulse{
    0%,100%{opacity:.20;}
    50%    {opacity:.80;}
  }
  /* Jos käyttäjä on estänyt liikkeen, kehys palaa tasaisesti. */
  @media (prefers-reduced-motion:reduce){
    body.rec #recglow{animation:none;opacity:.55;}
  }

  #board{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;gap:4px;
    padding:4px;touch-action:none;
  }
  #board.hide{display:none;}
  .row{flex:1 1 0;min-height:0;display:flex;gap:4px;}
  .key{
    position:relative;
    flex:1 1 0;min-width:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    background:var(--key);color:var(--ink);
    border:none;border-radius:6px;padding:0;
  }
  .key.tonic{box-shadow:inset 0 0 0 3px var(--tonic);}
  .key.on{background:var(--key-on);}
  .degree{font-size:clamp(12px,2.2vh,24px);font-weight:600;line-height:1;}
  .name{font-size:clamp(8px,1.1vh,11px);letter-spacing:.05em;opacity:.6;line-height:1;}
  .kb{position:absolute;top:4px;right:6px;font-size:10px;font-weight:600;opacity:.3;line-height:1;}
  @media (pointer:coarse){ .kb{display:none;} }
</style>
</head>
<body>

<div id="bar">
  <label>Sävel <select id="root"></select></label>
  <label>Sävellaji <select id="scale"></select></label>
  <button id="rec" type="button">Nauhoita</button>
</div>

<div id="midrow">
  <div id="octbox">
    <button id="octdown" type="button" aria-label="Oktaavi alas">OKT&#9660;</button>
    <span id="octnow"></span>
    <button id="octup" type="button" aria-label="Oktaavi ylös">&#9650;OKT</button>
  </div>
  <div id="tempobox">
    <button id="kick" type="button">Kick</button>
    <button id="bpmdown" type="button" aria-label="Hitaammaksi">&#8722;</button>
    <button id="bpmnow" type="button" aria-label="Napauta tempo">120</button>
    <button id="bpmup" type="button" aria-label="Nopeammaksi">+</button>
  </div>
</div>

<div id="trackrow">
  <div id="tabs"></div>
  <button id="findbtn"  type="button">Etsin</button>
  <button id="lanesbtn" type="button">Rivit</button>
  <button id="mixbtn"   type="button">Ääni</button>
  <button id="savebtn"  type="button">Otos</button>
</div>

<div id="strip">
  <div id="striptop">
    <span id="count">0</span>
    <div id="notes"></div>
  </div>
  <!-- rivi 1: kohdistin ja nykyinen nuotti -->
  <div class="btnrow">
    <button id="prev"    type="button" aria-label="Edellinen nuotti" disabled>&#9664;</button>
    <button id="next"    type="button" aria-label="Seuraava nuotti" disabled>&#9654;</button>
    <button id="shorter" type="button" aria-label="Lyhennä" disabled>&#8722;</button>
    <button id="longer"  type="button" aria-label="Pidennä" disabled>+</button>
    <button id="down"    type="button" aria-label="Aste alas" disabled>&#9660;</button>
    <button id="up"      type="button" aria-label="Aste ylös" disabled>&#9650;</button>
  </div>
  <!-- rivi 2: rakenne -->
  <div class="btnrow wide">
    <button id="rest"   type="button">Tauko</button>
    <button id="del"    type="button" disabled>Poista</button>
    <button id="select" type="button" disabled>Valitse</button>
    <button id="copy"   type="button" disabled>Kopioi</button>
    <button id="paste"  type="button" disabled>Liitä</button>
    <button id="clear"  type="button" disabled>Tyhjennä</button>
  </div>
  <div class="btnrow">
    <button id="play"     type="button" aria-label="Toista alusta" disabled>&#9654;</button>
    <button id="playhere" type="button" aria-label="Toista kohdistimesta" disabled>&#9654;|</button>
    <button id="loop"     type="button" aria-label="Silmukka">&#8635;</button>
    <button id="mode"     type="button">Raita</button>
    <button id="undo"     type="button" disabled>Kumoa</button>
    <button id="export"   type="button" disabled>Vie</button>
  </div>
</div>

<div id="mixer"></div>
<div id="savepanel"></div>
<div id="lanes"></div>
<div id="finder"></div>
<div id="board"></div>

<div id="recglow" aria-hidden="true"></div>

<script>
"use strict";

/* ---------- sävelteoria ---------- */

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

const SCALES = {
  "Duuri":              [0,2,4,5,7,9,11],
  "Luonnollinen molli": [0,2,3,5,7,8,10],
  "Harmoninen molli":   [0,2,3,5,7,8,11],
  "Melodinen molli":    [0,2,3,5,7,9,11],
  "Doorinen":           [0,2,3,5,7,9,10],
  "Fryyginen":          [0,1,3,5,7,8,10],
  "Lyydinen":           [0,2,4,6,7,9,11],
  "Miksolyydinen":      [0,2,4,5,7,9,10],
  "Lokrinen":           [0,1,3,5,6,8,10],
  "Duuripentatoninen":  [0,2,4,7,9],
  "Mollipentatoninen":  [0,3,5,7,10],
  "Blues":              [0,3,5,6,7,10]
};

const KB_ROWS = [
  ["KeyQ","KeyW","KeyE","KeyR","KeyT","KeyY","KeyU"],
  ["KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyJ"],
  ["KeyZ","KeyX","KeyC","KeyV","KeyB","KeyN","KeyM"]
];

const ROWS    = 3;
const OCT_MIN = 1, OCT_MAX = 5;

// Pituudet nuottiarvoina, perusmitta 1 = kahdeksasosa. Mukana vain oikeita
// nuottiarvoja: pisteelliset (1.5, 3, 6) mutta ei 2.5:n kaltaisia, joita ei
// pysty merkitsemään nuoteiksi eikä siksi käyttämään mihinkään.
const LENS      = [0.25, 0.5, 1, 1.5, 2, 3, 4, 6, 8];
const LEN_LABEL = { 0.25:"¼", 0.5:"½", 1:"1", 1.5:"1½", 2:"2", 3:"3", 4:"4", 6:"6", 8:"8" };

const UNITS_PER_BAR = 8;          // 4/4-tahti kahdeksasosina

const step    = () => 30 / bpm;
const beatDur = () => 60 / bpm;

/* ---------- raidat ---------- */

/* ---------- soittimet ----------

   [kerroin perustaajuudesta, alkuvoimakkuus, vaimenemisen suhde].
   Saha = kaikki yläsävelet 1/n, neliö = vain parittomat, kello = epäharmoniset
   kertoimet. detune (senteissä) kahdentaa jokaisen osaäänen hieman vireestä
   -> leveä, huojuva supersaw. Se maksaa kaksinkertaisen oskillaattorimäärän,
   joten sitä on vain kahdessa presetissä.                                    */

// Neljä paikkaa. Jokaisella oma soitin, oktaavi ja voimakkuus.
const TRACKS = [
  { oct:3, vol:1.0, preset:0  },   // Piano
  { oct:1, vol:1.4, preset:9  },   // Basso
  { oct:3, vol:1.0, preset:8  },   // Ontto
  { oct:2, vol:0.9, preset:7  }    // Urut
];

const presets = TRACKS.map(t => t.preset);

const nameOf = i => (PRESETS[presets[i]] || PRESETS[0]).name;
const toneOf = i => (PRESETS[presets[i]] || PRESETS[0]).tone;

const VOL_MIN = 0, VOL_MAX = 2.0;

const lanes   = TRACKS.map(() => []);
const cursors = TRACKS.map(() => 0);
const octaves = TRACKS.map(t => t.oct);
const vols    = TRACKS.map(t => t.vol);
const muted   = TRACKS.map(() => false);
let kickVol   = 1.0;

let active  = 0;
let playAll = false;
let mixing  = false;

let selecting = false, anchor = -1, focus = -1;
let clip = [];

const state = { root:0, scale:"Duuri" };

const seq    = () => lanes[active];
const isRest = it => it && it.r === true;
const hasSel = () => anchor >= 0 && focus >= 0;
const selLo  = () => Math.min(anchor, focus);
const selHi  = () => Math.max(anchor, focus);

const midiToName = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

/* ---------- säilytys ---------- */

const STORE_KEY = "savelluonnos.v1";

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v:6, lanes:lanes, octaves:octaves, vols:vols, kickVol:kickVol, presets:presets,
      muted:muted, looping:looping, droneVol:droneVol,
      active:active, playAll:playAll, root:state.root, scale:state.scale,
      bpm:bpm, kick:kickMode
    }));
  }catch(err){ /* täysi tai estetty tallennus: jatketaan ilman */ }
}

// Jokainen arvo tarkistetaan erikseen: vioittunut tai muokattu
// tallennus ei saa päätyä sellaisenaan käyttöön.
function readItem(it){
  if (Number.isInteger(it) && it >= 0 && it <= 127) return { n:it, d:1 };
  if (!it || typeof it !== "object") return null;
  const d = LENS.indexOf(it.d) >= 0 ? it.d : 1;
  if (it.r === true) return { r:true, d:d };
  if (Number.isInteger(it.n) && it.n >= 0 && it.n <= 127) return { n:it.n, d:d };
  return null;
}

const okVol = v => typeof v === "number" && isFinite(v) && v >= VOL_MIN && v <= VOL_MAX;

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(err){ return; }
  if (!raw) return;
  try{
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("muoto");

    if (Array.isArray(d.lanes)){
      for (let t = 0; t < TRACKS.length; t++){
        const src = d.lanes[t];
        if (!Array.isArray(src)) continue;
        for (const it of src){ const x = readItem(it); if (x) lanes[t].push(x); }
      }
    } else if (Array.isArray(d.seq)){
      for (const it of d.seq){ const x = readItem(it); if (x) lanes[0].push(x); }
    }

    if (Array.isArray(d.octaves)){
      for (let t = 0; t < TRACKS.length; t++){
        const o = d.octaves[t];
        if (Number.isInteger(o) && o >= OCT_MIN && o <= OCT_MAX) octaves[t] = o;
      }
    } else if (Number.isInteger(d.octave) && d.octave >= OCT_MIN && d.octave <= OCT_MAX){
      octaves[0] = d.octave;
    }

    if (Array.isArray(d.vols)){
      for (let t = 0; t < TRACKS.length; t++) if (okVol(d.vols[t])) vols[t] = d.vols[t];
    }
    if (okVol(d.kickVol)) kickVol = d.kickVol;

    if (Array.isArray(d.presets)){
      for (let t = 0; t < TRACKS.length; t++){
        const p = d.presets[t];
        if (Number.isInteger(p) && p >= 0 && p < PRESETS.length) presets[t] = p;
      }
    }

    if (Array.isArray(d.muted)){
      for (let t = 0; t < TRACKS.length; t++) muted[t] = d.muted[t] === true;
    }
    if (typeof d.looping === "boolean") looping = d.looping;
    if (okVol(d.droneVol)) droneVol = d.droneVol;

    if (Number.isInteger(d.active) && d.active >= 0 && d.active < TRACKS.length) active = d.active;
    if (typeof d.playAll === "boolean") playAll = d.playAll;
    if (Number.isInteger(d.root) && d.root >= 0 && d.root < 12) state.root = d.root;
    if (typeof d.scale === "string" && Object.prototype.hasOwnProperty.call(SCALES, d.scale)) state.scale = d.scale;
    if (BPMS.indexOf(d.bpm) >= 0) bpm = d.bpm;
    if (KICK_MODES.indexOf(d.kick) >= 0) kickMode = d.kick;
  }catch(err){
    for (const l of lanes) l.length = 0;
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  }
  for (let t = 0; t < TRACKS.length; t++) cursors[t] = lanes[t].length;
}

/* ================================================================
   ÄÄNI

   Jokaisella raidalla on oma äänenvoimakkuussolmu masterin edessä.
   Säätö vaikuttaa siis myös jo soiviin nuotteihin — voit siis mikata
   toiston aikana ja kuulla muutoksen heti.
   ================================================================ */

let ac = null, master = null, noiseBuf = null;
let trackGain = [], kickGain = null;

const INHARM = 0.0004;

function wakeAudio(){
  if (!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.ratio.value = 7;
    comp.attack.value = 0.004;
    comp.release.value = 0.20;

    master = ac.createGain();
    master.gain.value = 0.45;
    master.connect(comp).connect(ac.destination);

    trackGain = TRACKS.map((t, i) => {
      const g = ac.createGain();
      g.gain.value = muted[i] ? 0 : vols[i];
      g.connect(master);
      return g;
    });

    kickGain = ac.createGain();
    kickGain.gain.value = kickVol;
    kickGain.connect(master);

    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.05), ac.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  if (ac.state !== "running") ac.resume();
}

function applyVol(i){
  if (!ac) return;
  const t = ac.currentTime;
  if (i === "kick") kickGain.gain.setTargetAtTime(kickVol, t, 0.01);
  else trackGain[i].gain.setTargetAtTime(muted[i] ? 0 : vols[i], t, 0.01);
}

const toneLen = (tone, m) => Math.min(tone.len, Math.max(0.35, tone.len * Math.pow(2, -(m - 45) / 26)));

function voice(midi, at, hold, tone, dest){
  const f0  = midiToFreq(midi);
  const dur = toneLen(tone, midi);

  const out = ac.createGain();
  out.gain.setValueAtTime(0.0001, at);
  out.gain.linearRampToValueAtTime(1, at + tone.attack);

  let stopAt = at + dur + 0.3;
  if (hold && hold + 0.12 < dur){
    out.gain.setValueAtTime(1, at + hold);
    out.gain.linearRampToValueAtTime(0.0001, at + hold + 0.10);
    stopAt = at + hold + 0.16;
  }

  const lp = ac.createBiquadFilter();
  lp.type = "lowpass";
  lp.Q.value = 0.4;
  lp.frequency.setValueAtTime(Math.min(12000, f0 * tone.lpOpen), at);
  lp.frequency.exponentialRampToValueAtTime(Math.max(300, f0 * tone.lpClose), at + dur * 0.55);

  out.connect(lp).connect(dest || master);

  const nodes = [];

  const det   = tone.detune || 0;
  const spread = det ? [-det, det] : [0];

  for (const p of tone.partials){
    const n       = p[0];
    const stretch = n * Math.sqrt(1 + INHARM * n * n);

    const g = ac.createGain();
    g.gain.setValueAtTime(p[1] * tone.gain, at);
    g.gain.setTargetAtTime(0.0001, at + tone.attack, Math.max(0.05, dur * p[2] * 0.32));
    g.connect(out);

    for (const c of spread){
      const o = ac.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(f0 * stretch, at);
      if (c) o.detune.setValueAtTime(c, at);
      o.connect(g);
      o.start(at);
      o.stop(stopAt);
      nodes.push(o);
    }
  }

  if (tone.hit > 0){
    const nz = ac.createBufferSource();
    nz.buffer = noiseBuf;
    const bp = ac.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = Math.min(6000, f0 * 5);
    bp.Q.value = 0.8;
    const ng = ac.createGain();
    ng.gain.setValueAtTime(tone.hit, at);
    ng.gain.exponentialRampToValueAtTime(0.0001, at + 0.035);
    nz.connect(bp).connect(ng).connect(out);
    nz.start(at);
    nz.stop(at + 0.06);
    nodes.push(nz);
  }

  return { out, nodes };
}

const laneVoice = (t, midi, at, hold) => voice(midi, at, hold, toneOf(t), trackGain[t]);

/* ---------- kick ---------- */

function kick(at){
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, at);
  o.frequency.exponentialRampToValueAtTime(45, at + 0.085);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(0.95, at + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.30);
  o.connect(g).connect(kickGain);
  o.start(at);
  o.stop(at + 0.32);

  const nz = ac.createBufferSource();
  nz.buffer = noiseBuf;
  const hp = ac.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 1200;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(0.16, at);
  ng.gain.exponentialRampToValueAtTime(0.0001, at + 0.022);
  nz.connect(hp).connect(ng).connect(kickGain);
  nz.start(at);
  nz.stop(at + 0.04);
}

/* ---------- metronomi ---------- */

let metroTimer = null, metroNext = 0;

function metroInterval(){
  return kickMode === "beat" ? beatDur() : beatDur() * BEATS_PER_BAR;
}

function metroTick(){
  if (!ac || kickMode === "off") return;
  const ahead = ac.currentTime + 0.20;
  let guard = 0;
  while (metroNext < ahead && guard++ < 32){
    if (metroNext > ac.currentTime) kick(metroNext);
    metroNext += metroInterval();
  }
}

function metroStart(at){
  if (kickMode === "off") return;
  wakeAudio();
  metroNext = at !== undefined ? at : ac.currentTime + 0.12;
  if (metroTimer) clearInterval(metroTimer);
  metroTimer = setInterval(metroTick, 25);
  metroTick();
}

function metroStop(){
  if (metroTimer) clearInterval(metroTimer);
  metroTimer = null;
}

let live = null, playingNote = null;

function noteOn(midi){
  wakeAudio();
  noteOff(0.12);
  live = laneVoice(active, midi, ac.currentTime, 0);
  playingNote = midi;
}

function noteOff(fade){
  if (!live) return;
  const t = ac.currentTime;
  const f = fade || 0.18;
  try{
    live.out.gain.cancelScheduledValues(t);
    live.out.gain.setValueAtTime(live.out.gain.value, t);
    live.out.gain.linearRampToValueAtTime(0.0001, t + f);
    for (const n of live.nodes){ try{ n.stop(t + f + 0.02); }catch(e){} }
  }catch(e){}
  live = null;
  playingNote = null;
}

function blip(midi){
  wakeAudio();
  laneVoice(active, midi, ac.currentTime, 0);
}

/* ---------- toisto ---------- */

let voices = [], starts = [], playEnd = 0, playRaf = 0, isPlaying = false;
let fromIdx = 0, toIdx = -1, playIdx = -1;   // toistoikkuna ja soiva nuotti
let looping = false;

// Toistoikkuna on absoluuttista aikaa (perusmitoissa), ei nuotti-indeksejä.
// Näin sama ikkuna koskee kaikkia raitoja: kun kuuntelet tahteja 5-6, kuulet
// jokaiselta raidalta juuri sen kohdan. u1 = null tarkoittaa loppuun asti.
// Ikkunan ulkopuoliset nuotit saavat merkkiajaksi at0:n, jotta nauhan
// korostuslogiikka pysyy indeksien kanssa linjassa.
const EPS = 1e-9;

function scheduleLane(t, at0, u0, u1){
  const s = step();
  let u = 0, end = at0;
  const marks = [];
  for (const it of lanes[t]){
    const st = u;
    u += it.d;
    if (st < u0 - EPS || (u1 !== null && st >= u1 - EPS)){ marks.push(at0); continue; }
    const at  = at0 + (st - u0) * s;
    const len = s * it.d;
    marks.push(at);
    if (!isRest(it)) voices.push(laneVoice(t, it.n, at, len));
    if (at + len > end) end = at + len;
  }
  return { end: end, marks: marks };
}

// from = aloitusnuotti aktiivisella raidalla. Jos alue on valittuna, se
// määrää toistoikkunan kokonaan — silmukka kiertää silloin vain sitä.
function startPlay(from){
  const anything = playAll ? lanes.some(l => l.length) : seq().length;
  if (!anything) return;

  const lane = seq();
  let u0 = 0, u1 = null;

  if (hasSel()){
    for (let i = 0; i < selLo(); i++) u0 += lane[i].d;
    u1 = u0;
    for (let i = selLo(); i <= selHi(); i++) u1 += lane[i].d;
    fromIdx = selLo();
    toIdx   = selHi();
  } else {
    const skip = Math.max(0, Math.min(lane.length - 1, from || 0));
    for (let i = 0; i < skip; i++) u0 += lane[i].d;
    fromIdx = skip;
    toIdx   = lane.length - 1;
  }

  stopPlay(true);
  wakeAudio();
  noteOff(0.05);

  const at0 = ac.currentTime + 0.14;
  voices = [];
  let end = at0;

  for (let t = 0; t < TRACKS.length; t++){
    if (!playAll && t !== active) continue;
    const r = scheduleLane(t, at0, u0, u1);
    if (t === active) starts = r.marks;
    if (r.end > end) end = r.end;
  }

  // Silmukan pituus on ikkunan mitta, ei viimeisen nuotin loppu — muuten
  // kierto venyisi pitkän nuotin jälkikaiun verran pidemmäksi.
  playEnd = u1 !== null ? at0 + (u1 - u0) * step() : end;
  isPlaying = true;
  (fromIdx ? hereBtn : playBtn).classList.add("on");
  playBtn.innerHTML = "&#9632;";
  hereBtn.innerHTML = "&#9632;";
  playBtn.setAttribute("aria-label", "Pysäytä");
  metroStart(at0);
  tickPlay();
}

function stopPlay(restarting){
  if (playRaf) cancelAnimationFrame(playRaf);
  playRaf = 0;
  if (voices.length && ac){
    const t = ac.currentTime;
    for (const v of voices){
      try{
        v.out.gain.cancelScheduledValues(t);
        v.out.gain.setValueAtTime(v.out.gain.value, t);
        v.out.gain.linearRampToValueAtTime(0.0001, t + 0.06);
        for (const n of v.nodes){ try{ n.stop(t + 0.08); }catch(e){} }
      }catch(e){}
    }
  }
  voices = [];
  if (!isPlaying) return;
  isPlaying = false;
  playBtn.classList.remove("on");
  hereBtn.classList.remove("on");
  playBtn.innerHTML = "&#9654;";
  hereBtn.innerHTML = "&#9654;|";
  playBtn.setAttribute("aria-label", "Toista alusta");
  markPlay(-1);
  if (!restarting){ fromIdx = 0; toIdx = -1; }
  if (kickMode !== "off") metroStart();
}

function tickPlay(){
  const now = ac.currentTime;
  if (now >= playEnd){
    // Silmukka lähtee samasta kohdasta josta toisto aloitettiin.
    if (looping) startPlay(fromIdx); else stopPlay();
    return;
  }
  let i = -1;
  const last = Math.min(toIdx, starts.length - 1);
  for (let k = fromIdx; k <= last; k++){ if (now >= starts[k]) i = k; else break; }
  playIdx = i;
  markPlay(i);
  playRaf = requestAnimationFrame(tickPlay);
}

function markPlay(i){
  const spans = notesEl.querySelectorAll("span.note");
  for (let k = 0; k < spans.length; k++) spans[k].classList.toggle("playing", k === i);
  const it = i >= 0 ? seq()[i] : null;
  if (it && !isRest(it)){
    const s = spans[i];
    if (s) s.scrollIntoView({ block:"nearest", inline:"nearest" });
    lightMidi(it.n);
  } else {
    lightMidi(null);
  }
}

/* ---------- sävelaskelsiirto ----------
   Nuotti muunnetaan asteikon "portaikon" indeksiksi ja takaisin. Siirto on
   siis asteittainen, ei puolisävelaskelittainen: tulos pysyy aina
   sävellajissa. Sävellajin ulkopuolinen nuotti (esim. sävellajia vaihdettu
   jälkikäteen) napsahtaa lähimpään alempaan asteeseen.                     */

function toLadder(m){
  const steps = SCALES[state.scale];
  const rel = m - state.root;
  const oct = Math.floor(rel / 12);
  const pc  = rel - oct * 12;
  let k = steps.indexOf(pc);
  if (k < 0){
    k = 0;
    for (let i = 0; i < steps.length; i++) if (steps[i] <= pc) k = i;
  }
  return oct * steps.length + k;
}

function fromLadder(idx){
  const steps = SCALES[state.scale];
  const oct = Math.floor(idx / steps.length);
  const k   = idx - oct * steps.length;
  return state.root + oct * 12 + steps[k];
}

function nudge(dir){
  const lane = seq();
  const lo = hasSel() ? selLo() : (cursors[active] > 0 ? cursors[active] - 1 : -1);
  const hi = hasSel() ? selHi() : lo;
  if (lo < 0) return;

  // Ei siirretä mitään, jos yksikin nuotti karkaisi MIDI-alueelta.
  for (let i = lo; i <= hi; i++){
    const it = lane[i];
    if (isRest(it)) continue;
    const m = fromLadder(toLadder(it.n) + dir);
    if (m < 0 || m > 127) return;
  }

  snapshot();
  let last = -1;
  for (let i = lo; i <= hi; i++){
    const it = lane[i];
    if (isRest(it)) continue;
    it.n = fromLadder(toLadder(it.n) + dir);
    last = it.n;
  }
  stopPlay();
  drawSeq();
  if (lo === hi && last >= 0) blip(last);
}

/* ---------- undo ----------
   Ennen jokaista nuotteja muuttavaa operaatiota otetaan tilannekuva
   kaikista neljästä raidasta. Ne ovat pieniä taulukoita, joten 40
   askeleen historia maksaa kilotavuja. Undo palauttaa myös kohdistimet,
   jotta liitoksen peruminen vie takaisin siihen mistä lähdit.          */

const HIST_MAX = 40;
const history  = [];

function snapshot(){
  history.push({
    lanes:   lanes.map(l => l.map(it => Object.assign({}, it))),
    cursors: cursors.slice(),
    octaves: octaves.slice(),
    vols:    vols.slice(),
    presets: presets.slice(),
    kickVol: kickVol,
    root:    state.root,
    scale:   state.scale,
    bpm:     bpm,
    active:  active
  });
  if (history.length > HIST_MAX) history.shift();
}

function undo(){
  const s = history.pop();
  if (!s) return;
  stopPlay();
  for (let t = 0; t < TRACKS.length; t++){
    lanes[t].length = 0;
    for (const it of s.lanes[t]) lanes[t].push(it);
    cursors[t] = s.cursors[t];
    octaves[t] = s.octaves[t];
    vols[t]    = s.vols[t];
    presets[t] = s.presets[t];
    applyVol(t);
  }
  kickVol = s.kickVol; applyVol("kick");
  state.root = s.root; state.scale = s.scale; bpm = s.bpm; active = s.active;
  rootSel.value = state.root; scaleSel.value = state.scale;
  clearSel();
  drawTempo();
  buildBoard();
  drawSeq();
}

function insertAtCursor(item){
  snapshot();
  clearSel();
  seq().splice(cursors[active], 0, item);
  cursors[active]++;
  drawSeq();
}

function capture(midi){
  if (!armed) return;
  insertAtCursor({ n:midi, d:1 });
}

function deleteAtCursor(){
  stopPlay();
  snapshot();
  if (hasSel()){
    const lo = selLo(), hi = selHi();
    seq().splice(lo, hi - lo + 1);
    cursors[active] = lo;
    clearSel();
    drawSeq();
    return;
  }
  if (cursors[active] === 0) return;
  seq().splice(cursors[active] - 1, 1);
  cursors[active]--;
  drawSeq();
}

// Lähin sallittu pituus annetulle arvolle (6 x 2 = 12 ei ole listalla).
function nearestLen(v){
  let best = LENS[0];
  for (const l of LENS) if (Math.abs(l - v) < Math.abs(best - v)) best = l;
  return best;
}

// Yhdelle nuotille askellus listaa pitkin, valinnalle kertominen kahdella.
// Ero on olennainen: askellus muuttaa nuottien keskinäisiä suhteita
// (1 ja 0.5 -> 1.5 ja 1), kertominen säilyttää ne (-> 2 ja 1).
function changeLen(dir){
  const lane = seq();

  if (hasSel()){
    snapshot();
    for (let i = selLo(); i <= selHi(); i++){
      const it = lane[i];
      it.d = nearestLen(dir > 0 ? it.d * 2 : it.d / 2);
    }
  } else {
    if (cursors[active] === 0) return;
    snapshot();
    const it = lane[cursors[active] - 1];
    let i = LENS.indexOf(it.d);
    if (i < 0) i = 1;
    it.d = LENS[Math.max(0, Math.min(LENS.length - 1, i + dir))];
  }

  stopPlay();
  drawSeq();
}

function doCopy(){
  if (!hasSel()) return;
  clip = seq().slice(selLo(), selHi() + 1).map(it => Object.assign({}, it));
  cursors[active] = selHi() + 1;
  clearSel();
  drawSeq();
}

function doPaste(){
  if (!clip.length) return;
  stopPlay();
  snapshot();
  const lane = seq();
  let at = cursors[active];
  if (hasSel()){
    at = selLo();
    lane.splice(at, selHi() - selLo() + 1);
    clearSel();
  }
  const copy = clip.map(it => Object.assign({}, it));
  lane.splice.apply(lane, [at, 0].concat(copy));
  cursors[active] = at + copy.length;
  drawSeq();
}

// Leveys kasvaa pituuden mukana, mutta hidastuvasti — muuten kahdeksan
// yksikön nuotti veisi koko ruudun.
function noteWidth(d){
  return Math.round(20 + 26 * Math.min(d, 2) + 10 * Math.max(0, d - 2));
}

function drawSeq(){
  const lane = seq();
  if (cursors[active] > lane.length) cursors[active] = lane.length;
  if (cursors[active] < 0) cursors[active] = 0;
  if (anchor >= lane.length || focus >= lane.length) clearSel();
  const cur = cursors[active];
  const lo = hasSel() ? selLo() : -1;
  const hi = hasSel() ? selHi() : -2;

  notesEl.textContent = "";
  let caretEl = null;
  let units = 0;                     // neljäsosina perusmitasta, kokonaislukuina

  for (let i = 0; i <= lane.length; i++){
    // Tahtiviiva aina kun edelliset nuotit täyttivät tasan tahdin.
    if (i > 0 && units > 0 && units % (UNITS_PER_BAR * 4) === 0){
      const bl = document.createElement("b");
      bl.className = "barline";
      notesEl.append(bl);
    }
    if (i === cur && !hasSel()){
      caretEl = document.createElement("b");
      caretEl.className = "caret";
      notesEl.append(caretEl);
    }
    if (i === lane.length) break;

    const it = lane[i];
    const s  = document.createElement("span");
    s.className = "note"
      + (isRest(it) ? " rest" : "")
      + (i >= lo && i <= hi ? " range" : "")
      + (!hasSel() && i === cur - 1 ? " sel" : "");
    s.dataset.i = i;
    s.style.minWidth = noteWidth(it.d) + "px";

    const nm = document.createElement("em");
    nm.textContent = isRest(it) ? "–" : midiToName(it.n);
    const ln = document.createElement("i");
    ln.textContent = LEN_LABEL[it.d] || "1";
    s.append(nm, ln);
    notesEl.append(s);
    units += Math.round(it.d * 4);
  }

  if (!isPlaying && caretEl) caretEl.scrollIntoView({ block:"nearest", inline:"nearest" });

  const totalUnits = lane.reduce((a, it) => a + Math.round(it.d * 4), 0);
  const bars = totalUnits / (UNITS_PER_BAR * 4);
  countEl.textContent = "";
  const c1 = document.createElement("div");
  c1.textContent = hasSel() ? (hi - lo + 1) + "/" + lane.length : String(lane.length);
  const c2 = document.createElement("div");
  c2.className = "bars";
  c2.textContent = (Number.isInteger(bars) ? bars : bars.toFixed(1)) + " t";
  countEl.append(c1, c2);
  stripEl.classList.toggle("show", armed || lanes.some(l => l.length));

  const empty = lane.length === 0;
  playBtn.disabled  = playAll ? !lanes.some(l => l.length) : empty;
  hereBtn.disabled  = empty;
  delBtn.disabled   = !hasSel() && cur === 0;
  clearBtn.disabled = empty;
  expBtn.disabled   = playAll ? !lanes.some(l => l.length) : empty;
  selBtn.disabled   = empty;
  selBtn.classList.toggle("on", selecting);
  selBtn.textContent = selecting ? "Valmis" : "Valitse";
  copyBtn.disabled  = !hasSel();
  pasteBtn.disabled = clip.length === 0;
  undoBtn.disabled  = history.length === 0;

  // Napit kertovat kummassa tilassa ollaan: askellus vai kertominen.
  const one = !hasSel() && cur > 0 ? lane[cur - 1] : null;
  const selNotes = hasSel() ? lane.slice(lo, hi + 1) : [];
  shortBtn.textContent = hasSel() ? "\u00f72" : "\u2212";
  longBtn.textContent  = hasSel() ? "\u00d72" : "+";
  shortBtn.setAttribute("aria-label", hasSel() ? "Puolita pituudet" : "Lyhennä");
  longBtn.setAttribute("aria-label",  hasSel() ? "Kaksinkertaista pituudet" : "Pidennä");
  shortBtn.disabled = hasSel()
    ? selNotes.every(it => it.d === LENS[0])
    : (!one || one.d === LENS[0]);
  longBtn.disabled  = hasSel()
    ? selNotes.every(it => it.d === LENS[LENS.length - 1])
    : (!one || one.d === LENS[LENS.length - 1]);

  // Sävelaskelsiirto vaatii vähintään yhden oikean nuotin, ei pelkkiä taukoja.
  const range = hasSel() ? lane.slice(lo, hi + 1) : (one ? [one] : []);
  const movable = range.some(it => !isRest(it));
  upBtn.disabled = downBtn.disabled = !movable;

  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur >= lane.length;

  drawTracks();
  if (lanesEl.classList.contains("show")) drawLanes();
  saveState();
}

notesEl.addEventListener("click", e => {
  stopPlay();
  const spans = notesEl.querySelectorAll("span.note");
  if (!spans.length){ cursors[active] = 0; drawSeq(); return; }

  const x = e.clientX;
  const first = spans[0].getBoundingClientRect();
  if (x < first.left && !selecting){ cursors[active] = 0; drawSeq(); return; }

  let best = 0, bestD = Infinity;
  for (let i = 0; i < spans.length; i++){
    const r = spans[i].getBoundingClientRect();
    if (x >= r.left && x <= r.right){ best = i; bestD = 0; break; }
    const d = x < r.left ? r.left - x : x - r.right;
    if (d < bestD){ bestD = d; best = i; }
  }

  if (selecting){
    if (anchor < 0) anchor = focus = best;
    else focus = best;
  } else {
    cursors[active] = best + 1;
  }

  const it = seq()[best];
  if (!isRest(it)) blip(it.n);
  drawSeq();
});

recBtn.addEventListener("click", () => {
  armed = !armed;
  if (armed){ stopPlay(); clearSel(); if (mixing) setMixing(false); }
  recBtn.classList.toggle("armed", armed);
  document.body.classList.toggle("rec", armed);
  recBtn.textContent = armed ? "Seis" : "Nauhoita";
  recBtn.blur();
  drawSeq();
});

playBtn.addEventListener("click",  () => { isPlaying ? stopPlay() : startPlay(0); playBtn.blur(); });

// Toinen play jatkaa kohdistimesta. Kesken toiston se on tauko: kohdistin
// jää siihen nuottiin joka juuri soi, joten uusi painallus jatkaa siitä.
loopBtn.addEventListener("click", () => {
  looping = !looping;
  loopBtn.classList.toggle("on", looping);
  saveState();
  loopBtn.blur();
});

// Kohdistimen siirto nappina: sama kuin nuolinäppäimet koneella.
function moveCursor(dir){
  stopPlay();
  clearSel();
  cursors[active] += dir;
  drawSeq();
  auditionAtCursor();
}

prevBtn.addEventListener("click", () => { moveCursor(-1); prevBtn.blur(); });
nextBtn.addEventListener("click", () => { moveCursor(+1); nextBtn.blur(); });

upBtn.addEventListener("click",   () => { nudge(+1); upBtn.blur(); });
downBtn.addEventListener("click", () => { nudge(-1); downBtn.blur(); });

hereBtn.addEventListener("click", () => {
  if (isPlaying){
    const at = playIdx;
    stopPlay();
    if (at >= 0){ clearSel(); cursors[active] = at; drawSeq(); }
  } else {
    startPlay(cursors[active] > 0 ? cursors[active] - 1 : 0);
  }
  hereBtn.blur();
});
shortBtn.addEventListener("click", () => { changeLen(-1); shortBtn.blur(); });
longBtn.addEventListener("click",  () => { changeLen(+1); longBtn.blur(); });
delBtn.addEventListener("click",   () => { deleteAtCursor(); delBtn.blur(); });
undoBtn.addEventListener("click",  () => { undo(); undoBtn.blur(); });
copyBtn.addEventListener("click",  () => { doCopy(); copyBtn.blur(); });
pasteBtn.addEventListener("click", () => { doPaste(); pasteBtn.blur(); });

selBtn.addEventListener("click", () => {
  stopPlay();
  if (selecting){
    clearSel();
  } else {
    selecting = true;
    anchor = focus = -1;
    if (cursors[active] > 0) anchor = focus = cursors[active] - 1;
  }
  selBtn.blur();
  drawSeq();
});

restBtn.addEventListener("click", () => {
  stopPlay();
  insertAtCursor({ r:true, d:1 });
  restBtn.blur();
});

modeBtn.addEventListener("click", () => {
  stopPlay();
  playAll = !playAll;
  modeBtn.classList.toggle("all", playAll);
  modeBtn.textContent = playAll ? "Kaikki" : "Raita";
  modeBtn.blur();
  drawSeq();
});

clearBtn.addEventListener("click", () => {
  const lane = seq();
  if (lane.length && !confirm("Tyhjennetäänkö raita " + nameOf(active) + " (" + lane.length + " nuottia)?")) return;
  stopPlay();
  snapshot();
  lane.length = 0;
  cursors[active] = 0;
  clearSel();
  drawSeq();
  clearBtn.blur();
});

/* ---------- otokset ----------
   Tallenteilla ei ole käyttäjän kirjoittamaa nimeä lainkaan: kuvaus
   kootaan aikaleimasta ja sovelluksen omasta tilasta. Näin appiin ei
   synny yhtään kohtaa jossa käyttäjän tekstiä renderöidään.

   Omassa avaimessaan, jotta joka nuotin kohdalla tehtävä automaattinen
   tallennus ei kirjoita koko otoslistaa uudestaan.                      */

const SAVES_KEY = "savelluonnos.saves";
const SAVES_MAX = 30;

let saves = [];

function stateBundle(){
  return {
    ts:      Date.now(),
    lanes:   lanes.map(l => l.map(it => Object.assign({}, it))),
    octaves: octaves.slice(),
    vols:    vols.slice(),
    presets: presets.slice(),
    kickVol: kickVol,
    root:    state.root,
    scale:   state.scale,
    bpm:     bpm
  };
}

// Sama kaava kuin muualla: jokainen kenttä tarkistetaan erikseen,
// mitään ei kopioida tallenteesta sellaisenaan.
function readSave(o){
  if (!o || typeof o !== "object" || Array.isArray(o)) return null;
  if (!Number.isFinite(o.ts)) return null;
  if (!Array.isArray(o.lanes)) return null;

  const b = {
    ts:      o.ts,
    lanes:   TRACKS.map(() => []),
    octaves: TRACKS.map(t => t.oct),
    vols:    TRACKS.map(t => t.vol),
    presets: TRACKS.map(t => t.preset),
    kickVol: 1.0,
    root:    0,
    scale:   "Duuri",
    bpm:     120
  };

  for (let t = 0; t < TRACKS.length; t++){
    const src = o.lanes[t];
    if (!Array.isArray(src)) continue;
    for (const it of src){ const x = readItem(it); if (x) b.lanes[t].push(x); }
  }
  if (Array.isArray(o.octaves)){
    for (let t = 0; t < TRACKS.length; t++){
      const v = o.octaves[t];
      if (Number.isInteger(v) && v >= OCT_MIN && v <= OCT_MAX) b.octaves[t] = v;
    }
  }
  if (Array.isArray(o.vols)){
    for (let t = 0; t < TRACKS.length; t++) if (okVol(o.vols[t])) b.vols[t] = o.vols[t];
  }
  if (Array.isArray(o.presets)){
    for (let t = 0; t < TRACKS.length; t++){
      const p = o.presets[t];
      if (Number.isInteger(p) && p >= 0 && p < PRESETS.length) b.presets[t] = p;
    }
  }
  if (okVol(o.kickVol)) b.kickVol = o.kickVol;
  if (Number.isInteger(o.root) && o.root >= 0 && o.root < 12) b.root = o.root;
  if (typeof o.scale === "string" && Object.prototype.hasOwnProperty.call(SCALES, o.scale)) b.scale = o.scale;
  if (BPMS.indexOf(o.bpm) >= 0) b.bpm = o.bpm;

  if (!b.lanes.some(l => l.length)) return null;
  return b;
}

function loadSaves(){
  let raw = null;
  try{ raw = localStorage.getItem(SAVES_KEY); }catch(err){ return; }
  if (!raw) return;
  try{
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) throw new Error("muoto");
    saves = arr.map(readSave).filter(Boolean).slice(0, SAVES_MAX);
  }catch(err){
    saves = [];
    try{ localStorage.removeItem(SAVES_KEY); }catch(e){}
  }
}

function storeSaves(){
  try{ localStorage.setItem(SAVES_KEY, JSON.stringify(saves)); }
  catch(err){ alert("Tallennustila on täynnä. Poista vanhoja otoksia."); }
}

const noteTotal = b => b.lanes.reduce((s, l) => s + l.length, 0);

function whenText(ts){
  const d = new Date(ts);
  const p = x => String(x).padStart(2, "0");
  return d.getDate() + "." + (d.getMonth() + 1) + ". " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function whatText(b){
  const used = b.lanes.map((l, i) => l.length ? (PRESETS[b.presets[i]] || PRESETS[0]).name : null).filter(Boolean);
  return NOTE_NAMES[b.root] + " " + b.scale.toLowerCase()
       + " · " + b.bpm + " BPM · " + noteTotal(b) + " nuottia"
       + " · " + used.join(", ");
}

function applyBundle(b){
  for (let t = 0; t < TRACKS.length; t++){
    lanes[t].length = 0;
    for (const it of b.lanes[t]) lanes[t].push(Object.assign({}, it));
    cursors[t] = lanes[t].length;
    octaves[t] = b.octaves[t];
    vols[t]    = b.vols[t];
    presets[t] = b.presets[t];
    applyVol(t);
  }
  kickVol = b.kickVol; applyVol("kick");
  state.root = b.root; state.scale = b.scale; bpm = b.bpm;
  rootSel.value = state.root; scaleSel.value = state.scale;
  clearSel();
  drawTempo();
  buildBoard();
  drawSeq();
}

function drawSaves(){
  savePanel.textContent = "";

  const add = document.createElement("button");
  add.type = "button";
  add.id = "savenow";
  add.textContent = "Tallenna nykyinen";
  add.disabled = !lanes.some(l => l.length);
  add.addEventListener("click", () => {
    if (saves.length >= SAVES_MAX){ alert("Otoksia on jo " + SAVES_MAX + ". Poista vanhoja ensin."); return; }
    saves.unshift(stateBundle());
    storeSaves();
    drawSaves();
  });
  savePanel.append(add);

  const list = document.createElement("div");
  list.id = "savelist";

  if (!saves.length){
    const e = document.createElement("div");
    e.id = "saveempty";
    e.textContent = "Ei tallennettuja otoksia. Tallenne säilyttää kaikki neljä raitaa, sävellajin, tempon, oktaavit ja voimakkuudet.";
    list.append(e);
  }

  saves.forEach((b, i) => {
    const row = document.createElement("div");
    row.className = "saverow";

    const txt = document.createElement("div");
    const w1 = document.createElement("div");
    w1.className = "when"; w1.textContent = whenText(b.ts);
    const w2 = document.createElement("div");
    w2.className = "what"; w2.textContent = whatText(b);
    txt.append(w1, w2);

    const open = document.createElement("button");
    open.type = "button";
    open.textContent = "Avaa";
    open.addEventListener("click", () => {
      if (lanes.some(l => l.length) && !confirm("Nykyinen työ korvataan. Kumoa palauttaa sen.")) return;
      stopPlay();
      snapshot();
      applyBundle(b);
      setPanel(null);
    });

    const drop = document.createElement("button");
    drop.type = "button";
    drop.className = "drop";
    drop.textContent = "Poista";
    drop.addEventListener("click", () => {
      if (!confirm("Poistetaanko otos " + whenText(b.ts) + "?")) return;
      saves.splice(i, 1);
      storeSaves();
      drawSaves();
    });

    row.append(txt, open, drop);
    list.append(row);
  });

  savePanel.append(list);
}

/* ---------- sävellajin etsin ----------
   Kaksivaiheinen, koska korvalla ei mene toisin: kolmisointu paljastaa
   juurisävelen ja duuri/molli-laadun, mutta doorinen, fryyginen ja molli
   antavat kaikki saman soinnun. Moodin erottaa vasta asteikko soitettuna.
   Borduna soi taustalla biisin kanssa: oikean juurisävelen tunnistaa siitä,
   milloin huojunta ja riitely katoavat.                                    */

const FIND_TONE = PRESETS[7].tone;      // Urut: tasainen ja pitkä, helppo verrata
const DRONE_BASE = 0.22;        // bordunan perustaso; kerroin on säädettävissä
let droneVol  = 1.4;
let findRoot  = 0;
let findScale = "Duuri";
let droneNodes = null;

const findBase = () => 48 + findRoot;   // C3-tasolta ylöspäin

function findChord(){
  wakeAudio();
  const steps = SCALES[findScale];
  const t = ac.currentTime;
  // Asteet 1, 3 ja 5 — sointu seuraa siis valittua sävellajia itsestään.
  for (const k of [0, 2, 4]){
    if (k >= steps.length) continue;
    voice(findBase() + 12 + steps[k], t, 1.6, FIND_TONE, master);
  }
}

function findRun(){
  wakeAudio();
  const steps = SCALES[findScale];
  const t = ac.currentTime + 0.05;
  const gap = 0.26;
  steps.forEach((s, i) => voice(findBase() + 12 + s, t + i * gap, gap * 0.95, FIND_TONE, master));
  voice(findBase() + 24, t + steps.length * gap, 0.9, FIND_TONE, master);
}

function startDrone(){
  wakeAudio();
  stopDrone();
  const t = ac.currentTime;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(DRONE_BASE * droneVol, t + 0.25);
  g.connect(master);
  const oscs = [0, 7, 12, 19].map(iv => {
    const o = ac.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(midiToFreq(findBase() + iv), t);
    const og = ac.createGain();
    og.gain.value = iv === 0 ? 0.5 : 0.22;
    o.connect(og).connect(g);
    o.start(t);
    return o;
  });
  droneNodes = { g: g, oscs: oscs };
}

// Säätö kuuluu heti, myös bordunan soidessa — muuten vertailu katkeaisi
// joka säädöllä.
function applyDroneVol(){
  if (!droneNodes || !ac) return;
  droneNodes.g.gain.setTargetAtTime(DRONE_BASE * droneVol, ac.currentTime, 0.02);
}

function stopDrone(){
  if (!droneNodes || !ac) return;
  const t = ac.currentTime;
  const d = droneNodes;
  droneNodes = null;
  try{
    d.g.gain.cancelScheduledValues(t);
    d.g.gain.setValueAtTime(d.g.gain.value, t);
    d.g.gain.linearRampToValueAtTime(0.0001, t + 0.2);
    for (const o of d.oscs) o.stop(t + 0.25);
  }catch(e){}
  const b = document.getElementById("drone");
  if (b) b.classList.remove("on");
}

// Seula: jokaiselle sävelasteelle kolme tilaa — testaamaton, sopii, ei sovi.
// Sävellajilista suodattuu sen mukaan. Tämä on sama katoamistesti kuin
// juurisävelellä, mutta yhdelle sävelelle kerrallaan: bordunan päälle
// soitettu väärä sävel riitelee biisin kanssa kuuluvasti.
const DEG_LABEL = ["1","♭2","2","♭3","3","4","♯4","5","♭6","6","♭7","7"];
const sieve = new Array(12).fill(0);

function scaleFits(name){
  const set = SCALES[name];
  for (let pc = 0; pc < 12; pc++){
    if (sieve[pc] === 0) continue;
    const inScale = set.indexOf(pc) >= 0;
    if (sieve[pc] === 1 && !inScale) return false;
    if (sieve[pc] === -1 && inScale) return false;
  }
  return true;
}

const LANE_PX  = 18;                      // pikseliä perusmittaa (1) kohden
const BAR_PX   = LANE_PX * UNITS_PER_BAR; // yhden tahdin leveys

let laneScroll = 0;                       // yhteinen vaakasijainti
let syncing    = false;                   // estää vieritysten kehäreaktion

const laneUnits = t => lanes[t].reduce((a, it) => a + it.d, 0);

function drawLanes(){
  const span = Math.max(8, ...TRACKS.map((x, t) => laneUnits(t)));
  const wide = span * LANE_PX + 40;

  lanesEl.textContent = "";

  TRACKS.forEach((cfg, t) => {
    const row = document.createElement("div");
    row.className = "lane" + (t === active ? " on" : "");

    const lbl = document.createElement("div");
    lbl.className = "lbl";
    const n1 = document.createElement("div");
    n1.textContent = nameOf(t);
    const n2 = document.createElement("i");
    n2.textContent = lanes[t].length ? lanes[t].length + " nt" : "–";
    lbl.append(n1, n2);

    const track = document.createElement("div");
    track.className = "track";

    const inner = document.createElement("div");
    inner.className = "inner";
    inner.style.width = wide + "px";
    inner.style.backgroundImage =
      "repeating-linear-gradient(to right, var(--bar) 0 3px, transparent 3px " + BAR_PX + "px)";
    inner.style.backgroundPosition = "0 0";

    let at = 0;
    lanes[t].forEach((it, i) => {
      const nb = document.createElement("div");
      nb.className = "nb" + (isRest(it) ? " rest" : "")
                   + (t === active && i === cursors[active] - 1 ? " cur" : "");
      nb.style.left  = (at * LANE_PX) + "px";
      nb.style.width = Math.max(3, it.d * LANE_PX - 2) + "px";
      // Nimi vain jos se mahtuu; muuten laatikko jää tyhjäksi palkiksi.
      if (!isRest(it) && it.d * LANE_PX >= 30) nb.textContent = midiToName(it.n);
      inner.append(nb);
      at += it.d;
    });

    if (t === active){
      let cx = 0;
      for (let i = 0; i < cursors[active] && i < lanes[t].length; i++) cx += lanes[t][i].d;
      const cl = document.createElement("div");
      cl.className = "cursorline";
      cl.style.left = (cx * LANE_PX - 1) + "px";
      inner.append(cl);
    }

    track.append(inner);

    track.addEventListener("scroll", () => {
      if (syncing) return;
      syncing = true;
      laneScroll = track.scrollLeft;
      for (const o of lanesEl.querySelectorAll(".track")) if (o !== track) o.scrollLeft = laneScroll;
      syncing = false;
    });

    // Napautus valitsee raidan ja nuotin; muokkaus tapahtuu tutuilla napeilla.
    track.addEventListener("click", e => {
      stopPlay();
      const r = track.getBoundingClientRect();
      const x = (e.clientX - r.left + track.scrollLeft) / LANE_PX;

      if (t !== active){ allKeysUp(); clearSel(); active = t; buildBoard(); }

      const lane = lanes[t];
      let acc = 0, hit = lane.length;
      for (let i = 0; i < lane.length; i++){
        if (x < acc + lane[i].d){ hit = i; break; }
        acc += lane[i].d;
      }
      if (hit < lane.length){
        cursors[t] = hit + 1;
        if (!isRest(lane[hit])) blip(lane[hit].n);
      } else {
        cursors[t] = lane.length;
      }
      clearSel();
      drawSeq();
    });

    row.append(lbl, track);
    lanesEl.append(row);
  });

  // Palautetaan yhteinen vieritys uudelleenpiirron jälkeen.
  syncing = true;
  for (const o of lanesEl.querySelectorAll(".track")) o.scrollLeft = laneScroll;
  syncing = false;
}

}

  if (v === bpm) return;
  bpm = v;

  else if (kickMode !== "off") metroStart();

function changeBpm(dir){
  const i = BPMS.indexOf(bpm);
  const j = Math.max(0, Math.min(BPMS.length - 1, (i < 0 ? 4 : i) + dir));
  setBpm(BPMS[j]);
}

/* ---------- tempon napautus ----------
   Mitataan napautusten väliä ja näytetään arvio elävänä. Kun napautus
   loppuu, arvo napsahtaa lähimpään sallittuun. Jos tulos jää alueen
   ulkopuolelle, se kerrotaan tai jaetaan kahdella: puolinopeudella tai
   kahdeksasosina napauttaminen on yleistä eikä se ole virhe.             */

const TAP_GAP    = 2000;   // ms — pidempi tauko aloittaa mittauksen alusta
const TAP_SETTLE = 1600;   // ms — tämän jälkeen arvo lukitaan

let tapTimes = [], tapTimer = null, tapRaw = null;

function tapTempo(){
  const now = performance.now();
  if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > TAP_GAP) tapTimes = [];
  tapTimes.push(now);
  if (tapTimes.length > 8) tapTimes.shift();

  if (tapTimes.length >= 2){
    const span = tapTimes[tapTimes.length - 1] - tapTimes[0];
    let v = 60000 / (span / (tapTimes.length - 1));
    while (v < BPMS[0] - 5) v *= 2;
    while (v > BPMS[BPMS.length - 1] + 5) v /= 2;
    tapRaw = v;
    bpmNow.textContent = Math.round(v);
  }

  bpmNow.classList.add("tapping");
  clearTimeout(tapTimer);
  tapTimer = setTimeout(finishTap, TAP_SETTLE);
}

function finishTap(){
  bpmNow.classList.remove("tapping");
  tapTimes = [];
  if (tapRaw === null){ drawTempo(); return; }
  let best = BPMS[0];
  for (const b of BPMS) if (Math.abs(b - tapRaw) < Math.abs(best - tapRaw)) best = b;
  tapRaw = null;
  setBpm(best);
  drawTempo();
}

document.getElementById("bpmdown").addEventListener("click", e => { changeBpm(-1); e.target.blur(); });
document.getElementById("bpmup").addEventListener("click",   e => { changeBpm(+1); e.target.blur(); });

/* ---------- MIDI-vienti ---------- */

const PPQ = 480, BASE_TICKS = 240;

function vlq(n){
  const out = [n & 0x7F];
  n >>>= 7;
  while (n > 0){ out.unshift((n & 0x7F) | 0x80); n >>>= 7; }
  return out;
}

function chunk(id, body){
  const n = body.length;
  return [
    id.charCodeAt(0), id.charCodeAt(1), id.charCodeAt(2), id.charCodeAt(3),
    (n >>> 24) & 0xFF, (n >>> 16) & 0xFF, (n >>> 8) & 0xFF, n & 0xFF
  ].concat(body);
}

function nameMeta(name){
  const bytes = [];
  for (const c of name) bytes.push(c.charCodeAt(0) & 0x7F);
  return [0x00, 0xFF, 0x03].concat(vlq(bytes.length), bytes);
}

function tempoMeta(){
  const us = Math.round(60000000 / bpm);
  return [0x00, 0xFF, 0x51, 0x03, (us >> 16) & 0xFF, (us >> 8) & 0xFF, us & 0xFF];
}

// Voimakkuus on vakio: kuuntelusäädöt eivät saa vääristää FL:ään
// vietävää aineistoa, koska puhelimen kaiutin ei ole miksausreferenssi.
function laneEvents(lane, channel){
  const ev = [];
  let pending = 0;                       // taukojen kertymä seuraavaan nuottiin
  for (const it of lane){
    const ticks = Math.max(1, Math.round(BASE_TICKS * it.d));
    if (isRest(it)){ pending += ticks; continue; }
    const p = Math.max(0, Math.min(127, it.n));
    ev.push.apply(ev, vlq(pending)); ev.push(0x90 | channel, p, 100);
    ev.push.apply(ev, vlq(ticks));   ev.push(0x80 | channel, p, 64);
    pending = 0;
  }
  ev.push(0x00, 0xFF, 0x2F, 0x00);
  return ev;
}

function buildMidi(){
  if (!playAll){
    const body = tempoMeta().concat(nameMeta((active + 1) + " " + nameOf(active)), laneEvents(seq(), 0));
    return new Uint8Array(
      chunk("MThd", [0,0, 0,1, (PPQ >> 8) & 0xFF, PPQ & 0xFF]).concat(chunk("MTrk", body))
    );
  }

  const used = [];
  for (let t = 0; t < TRACKS.length; t++) if (lanes[t].length) used.push(t);

  let bytes = chunk("MThd", [0,1, 0, used.length + 1, (PPQ >> 8) & 0xFF, PPQ & 0xFF]);
  bytes = bytes.concat(chunk("MTrk", tempoMeta().concat(nameMeta("Savelluonnos"), [0x00,0xFF,0x2F,0x00])));
  used.forEach((t, i) => {
    bytes = bytes.concat(chunk("MTrk", nameMeta((t + 1) + " " + nameOf(t)).concat(laneEvents(lanes[t], i & 0x0F))));
  });
  return new Uint8Array(bytes);
}

const slug = s => s.toLowerCase()
  .replace(/ä/g,"a").replace(/ö/g,"o")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function fileName(){
  const d = new Date();
  const p = x => String(x).padStart(2,"0");
  const stamp = p(d.getDate()) + p(d.getMonth()+1) + "-" + p(d.getHours()) + p(d.getMinutes());
  const what  = playAll ? "kaikki" : slug(nameOf(active));
  return "luonnos-" + what + "-" + slug(NOTE_NAMES[state.root]) + "-" + slug(state.scale) + "-" + bpm + "bpm-" + stamp + ".mid";
}

async function exportMidi(){
  stopPlay();
  const bytes = buildMidi();
  const name  = fileName();

  try{
    const file = new File([bytes], name, { type:"audio/midi" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:name });
      return;
    }
  }catch(err){
    if (err && err.name === "AbortError") return;
  }

  const url = URL.createObjectURL(new Blob([bytes], { type:"audio/midi" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

expBtn.addEventListener("click", () => { exportMidi(); expBtn.blur(); });

function buildBoard(){

  let visRow = 0;
  for (let row = ROWS - 1; row >= 0; row--, visRow++){

    rowEl.className = "row";
    steps.forEach((stp, i) => {
      const midi = 12 * (oct + 1) + state.root + stp + 12 * row;
      const key = document.createElement("button");
      key.className = "key" + (stp === 0 ? " tonic" : "");
      key.dataset.midi = midi;
      key.type = "button";
      key.tabIndex = -1;

      const d = document.createElement("span");
      d.className = "degree"; d.textContent = i + 1;
      const n = document.createElement("span");
      n.className = "name"; n.textContent = midiToName(midi);
      key.append(d, n);

      const code = KB_ROWS[visRow] && KB_ROWS[visRow][i];
      if (code){
        codeToKey.set(code, key);
        const kb = document.createElement("span");
        kb.className = "kb"; kb.textContent = code.slice(3);
        key.append(kb);
      }
      rowEl.append(key);
    });
    boardEl.append(rowEl);
  }

  octNow.textContent = "";
  for (let row = ROWS - 1; row >= 0; row--){
    const b = document.createElement("b");
    if (row === 0) b.className = "low";
    b.textContent = midiToName(12 * (oct + 1) + state.root + 12 * row);
    octNow.append(b);
  }

  octDn.disabled = oct <= OCT_MIN;
  octUp.disabled = oct >= OCT_MAX;
  saveState();
}

// Oktaavi on raitakohtainen: basso pysyy matalalla vaikka melodia on ylhäällä.
function shiftOctave(delta){
  const next = octaves[active] + delta;
  if (next < OCT_MIN || next > OCT_MAX) return;
  octaves[active] = next;
  release();
  allKeysUp();
  buildBoard();
}

octUp.addEventListener("click", () => { shiftOctave(+1); octUp.blur(); });
octDn.addEventListener("click", () => { shiftOctave(-1); octDn.blur(); });

function light(key){
  if (lit === key) return;
  if (lit) lit.classList.remove("on");
  if (key) key.classList.add("on");
  lit = key;
}

function lightMidi(midi){
  light(midi === null ? null : boardEl.querySelector('.key[data-midi="' + midi + '"]'));
}

/* ---------- kosketus ---------- */

const keyAt = (x, y) => {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest(".key") : null;
};

let pressing = false;

boardEl.addEventListener("pointerdown", e => {
  e.preventDefault();
  stopPlay();
  pressing = true;
  boardEl.setPointerCapture(e.pointerId);
  strike(e.clientX, e.clientY);
});

boardEl.addEventListener("pointermove", e => {
  if (pressing) strike(e.clientX, e.clientY);
});

function strike(x, y){
  const key = keyAt(x, y);
  if (!key) return;
  const midi = Number(key.dataset.midi);
  if (midi === playingNote) return;
  noteOn(midi);
  capture(midi);
  light(key);
}

function release(){
  if (!pressing) return;
  pressing = false;
  noteOff();
  light(null);
}
window.addEventListener("pointerup", release);
window.addEventListener("pointercancel", release);

/* ---------- fyysinen näppäimistö ---------- */

const held = [];

function keyDown(code){
  const key = codeToKey.get(code);
  if (!key || held.includes(code)) return;
  held.push(code);
  stopPlay();
  const midi = Number(key.dataset.midi);
  noteOn(midi);
  capture(midi);
  light(key);
}

function keyUp(code){
  const i = held.indexOf(code);
  if (i < 0) return;
  held.splice(i, 1);
  if (held.length){
    const key = codeToKey.get(held[held.length - 1]);
    if (key){
      const midi = Number(key.dataset.midi);
      if (midi !== playingNote){ noteOn(midi); light(key); }
      return;
    }
  }
  noteOff();
  light(null);
}

function allKeysUp(){
  held.length = 0;
  noteOff();
  light(null);
}

function auditionAtCursor(){
  const c = cursors[active];
  if (c > 0 && c <= seq().length){
    const it = seq()[c - 1];
    if (!isRest(it)) blip(it.n);
  }
}

function extendSel(dir){
  const lane = seq();
  if (!lane.length) return;
  if (!hasSel()){
    const start = Math.max(0, Math.min(lane.length - 1, cursors[active] - (dir < 0 ? 1 : 0)));
    anchor = focus = start;
  } else {
    focus = Math.max(0, Math.min(lane.length - 1, focus + dir));
  }
  selecting = true;
  drawSeq();
}

window.addEventListener("keydown", e => {
  if (e.repeat) return;
  const tag = e.target && e.target.tagName;
  if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;

  if (e.ctrlKey || e.metaKey){
    if (e.code === "KeyZ"){ e.preventDefault(); undo();    return; }
    if (e.code === "KeyC"){ e.preventDefault(); doCopy();  return; }
    if (e.code === "KeyV"){ e.preventDefault(); doPaste(); return; }
    if (e.code === "KeyA"){
      e.preventDefault();
      if (seq().length){ selecting = true; anchor = 0; focus = seq().length - 1; drawSeq(); }
      return;
    }
    return;
  }
  if (e.altKey) return;

  if (e.shiftKey && (e.code === "ArrowUp" || e.code === "ArrowDown")){
    e.preventDefault();
    nudge(e.code === "ArrowUp" ? +1 : -1);
    return;
  }

  if (e.shiftKey && (e.code === "ArrowLeft" || e.code === "ArrowRight")){
    e.preventDefault(); stopPlay();
    extendSel(e.code === "ArrowLeft" ? -1 : +1);
    return;
  }

  if (e.code === "Escape")     { e.preventDefault(); if (mixing || savePanel.classList.contains("show") || lanesEl.classList.contains("show") || finderEl.classList.contains("show")) setPanel(null); else { clearSel(); drawSeq(); } return; }
  if (e.code === "ArrowUp")    { e.preventDefault(); shiftOctave(+1); return; }
  if (e.code === "ArrowDown")  { e.preventDefault(); shiftOctave(-1); return; }
  if (e.code === "ArrowLeft")  { e.preventDefault(); stopPlay(); clearSel(); cursors[active]--; drawSeq(); auditionAtCursor(); return; }
  if (e.code === "ArrowRight") { e.preventDefault(); stopPlay(); clearSel(); cursors[active]++; drawSeq(); auditionAtCursor(); return; }
  if (e.code === "Backspace")  { e.preventDefault(); deleteAtCursor(); return; }
  if (e.code === "Space")      { e.preventDefault(); stopPlay(); insertAtCursor({ r:true, d:1 }); return; }
  if (e.code === "Minus" || e.code === "NumpadSubtract"){ e.preventDefault(); changeLen(-1); return; }
  if (e.code === "Equal" || e.code === "NumpadAdd")     { e.preventDefault(); changeLen(+1); return; }
  if (e.code === "KeyL")       { e.preventDefault(); loopBtn.click(); return; }
  if (e.code === "KeyT")       { e.preventDefault(); tapTempo(); return; }
  if (e.code === "Comma")      { e.preventDefault(); changeBpm(-1); return; }
  if (e.code === "Period")     { e.preventDefault(); changeBpm(+1); return; }

  if (e.code === "Digit1" || e.code === "Digit2" || e.code === "Digit3" || e.code === "Digit4"){
    e.preventDefault();
    const i = Number(e.code.slice(5)) - 1;
    if (i !== active){ stopPlay(); allKeysUp(); clearSel(); active = i; buildBoard(); drawSeq(); }
    return;
  }

  if (mixing) return;
  if (codeToKey.has(e.code)){ e.preventDefault(); keyDown(e.code); }
});

window.addEventListener("keyup", e => keyUp(e.code));

// Ikkunan menettäessä fokuksen mikään keyup ei tule perille — vapautetaan kaikki.
window.addEventListener("blur", () => { release(); allKeysUp(); });

/* ---------- ohjaimet ---------- */

const rootSel  = document.getElementById("root");
const scaleSel = document.getElementById("scale");

NOTE_NAMES.forEach((n, i) => rootSel.add(new Option(n, i)));
Object.keys(SCALES).forEach(n => scaleSel.add(new Option(n, n)));

rootSel.addEventListener("change",  e => { state.root  = Number(e.target.value); allKeysUp(); buildBoard(); e.target.blur(); });
scaleSel.addEventListener("change", e => { state.scale = e.target.value;         allKeysUp(); buildBoard(); e.target.blur(); });

document.addEventListener("pointerdown", wakeAudio, { once:true });

loadState();
loadSaves();
rootSel.value  = state.root;
scaleSel.value = state.scale;
modeBtn.textContent = playAll ? "Kaikki" : "Raita";
modeBtn.classList.toggle("all", playAll);
drawTempo();
loopBtn.classList.toggle("on", looping);
buildBoard();
drawSeq();
</script>
</body>
</html>
