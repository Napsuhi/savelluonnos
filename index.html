<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Sävelluonnos</title>
<style>
  :root{
    --bg:#0E1116;
    --panel:#171B22;
    --line:#232A34;
    --key:#D8DEE6;
    --key-on:#F2C14E;
    --tonic:#6FD3C0;
    --ink:#0E1116;
    --text:#8D97A5;
    --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;margin:0;overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:var(--mono);
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  body{
    display:flex;flex-direction:column;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---- ohjauspalkki ---- */
  #bar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:6px 10px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  #bar label{
    display:flex;align-items:center;gap:5px;
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  }
  select{
    font-family:var(--mono);font-size:13px;
    background:#0B0E12;color:var(--key);
    border:1px solid var(--line);border-radius:5px;
    padding:5px 6px;
    appearance:none;-webkit-appearance:none;
  }
  select:focus-visible{outline:2px solid var(--tonic);outline-offset:1px;}
  #hint{margin-left:auto;font-size:10px;letter-spacing:.06em;opacity:.55;}
  @media (orientation:landscape){ #hint{display:none;} }

  /* ---- koskettimisto ---- */
  #board{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;gap:4px;
    padding:4px;
    touch-action:none;
  }
  .row{
    flex:1 1 0;min-height:0;
    display:flex;gap:4px;
  }
  .key{
    flex:1 1 0;min-width:0;
    position:relative;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:2px;
    background:var(--key);
    color:var(--ink);
    border:none;border-radius:6px;
    padding:0;
  }
  /* toonika: koko sävellajin nollapiste, aina heti tunnistettavissa */
  .key.tonic{ box-shadow:inset 0 0 0 3px var(--tonic); }
  .key.on{ background:var(--key-on); }
  .degree{
    font-size:clamp(15px,4.2vh,30px);
    font-weight:600;line-height:1;
  }
  .name{
    font-size:clamp(8px,1.8vh,12px);
    letter-spacing:.05em;opacity:.6;line-height:1;
  }
  .row + .row{ position:relative; }
  .row + .row::before{
    content:"";position:absolute;left:0;right:0;top:-4px;height:1px;
    background:var(--line);
  }
</style>
</head>
<body>

<div id="bar">
  <label>Sävel
    <select id="root"></select>
  </label>
  <label>Sävellaji
    <select id="scale"></select>
  </label>
  <label>Oktaavi
    <select id="oct"></select>
  </label>
  <span id="hint">Käännä puhelin vaakaan</span>
</div>

<div id="board"></div>

<script>
"use strict";

/* ---------- sävelteoria ---------- */

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

// Sävellaji = puolisävelaskelten siirtymät juuriäänestä.
// Uuden lisääminen = yksi rivi tähän, ei muutoksia muualle.
const SCALES = {
  "Duuri":                [0,2,4,5,7,9,11],
  "Luonnollinen molli":   [0,2,3,5,7,8,10],
  "Harmoninen molli":     [0,2,3,5,7,8,11],
  "Melodinen molli":      [0,2,3,5,7,9,11],
  "Doorinen":             [0,2,3,5,7,9,10],
  "Fryyginen":            [0,1,3,5,7,8,10],
  "Lyydinen":             [0,2,4,6,7,9,11],
  "Miksolyydinen":        [0,2,4,5,7,9,10],
  "Lokrinen":             [0,1,3,5,6,8,10],
  "Duuripentatoninen":    [0,2,4,7,9],
  "Mollipentatoninen":    [0,3,5,7,10],
  "Blues":                [0,3,5,6,7,10]
};

const state = { root:0, scale:"Duuri", octave:4 };

const midiToName = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

/* ---------- ääni ---------- */

let ac = null, osc = null, amp = null, playing = null;

function wakeAudio(){
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state !== "running") ac.resume();
}

function noteOn(midi){
  wakeAudio();
  noteOff();
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(midiToFreq(midi), t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.34, t + 0.008);   // attack
  g.gain.linearRampToValueAtTime(0.20, t + 0.28);    // decay -> sustain
  o.connect(g).connect(ac.destination);
  o.start(t);
  osc = o; amp = g; playing = midi;
}

function noteOff(){
  if (!osc) return;
  const t = ac.currentTime;
  amp.gain.cancelScheduledValues(t);
  amp.gain.setValueAtTime(amp.gain.value, t);
  amp.gain.linearRampToValueAtTime(0.0001, t + 0.06); // release
  osc.stop(t + 0.09);
  osc = null; amp = null; playing = null;
}

/* ---------- koskettimisto ---------- */

const board = document.getElementById("board");

function buildBoard(){
  const steps = SCALES[state.scale];
  board.textContent = "";
  // ylempi oktaavi ylös: korkeampi sävel on ylempänä, kuten pianorollissa
  for (const row of [1, 0]){
    const rowEl = document.createElement("div");
    rowEl.className = "row";
    steps.forEach((step, i) => {
      const midi = 12 * (state.octave + 1) + state.root + step + 12 * row;
      const key = document.createElement("button");
      key.className = "key" + (step === 0 ? " tonic" : "");
      key.dataset.midi = midi;
      key.type = "button";
      const d = document.createElement("span");
      d.className = "degree";
      d.textContent = i + 1;
      const n = document.createElement("span");
      n.className = "name";
      n.textContent = midiToName(midi);
      key.append(d, n);
      rowEl.append(key);
    });
    board.append(rowEl);
  }
}

let lit = null;
function light(key){
  if (lit === key) return;
  if (lit) lit.classList.remove("on");
  if (key) key.classList.add("on");
  lit = key;
}

function keyAt(x, y){
  const el = document.elementFromPoint(x, y);
  return el ? el.closest(".key") : null;
}

let pressing = false;

board.addEventListener("pointerdown", e => {
  e.preventDefault();
  pressing = true;
  board.setPointerCapture(e.pointerId);
  strike(e.clientX, e.clientY);
});

board.addEventListener("pointermove", e => {
  if (pressing) strike(e.clientX, e.clientY);
});

function strike(x, y){
  const key = keyAt(x, y);
  if (!key) return;                       // koskettimien välissä: pidetään edellinen sävel
  const midi = Number(key.dataset.midi);
  if (midi === playing) return;           // sama kosketin: ei uudelleenlaukaisua
  noteOn(midi);
  light(key);
}

function release(){
  if (!pressing) return;
  pressing = false;
  noteOff();
  light(null);
}
window.addEventListener("pointerup", release);
window.addEventListener("pointercancel", release);
window.addEventListener("blur", release);

/* ---------- ohjaimet ---------- */

const rootSel  = document.getElementById("root");
const scaleSel = document.getElementById("scale");
const octSel   = document.getElementById("oct");

NOTE_NAMES.forEach((n, i) => rootSel.add(new Option(n, i)));
Object.keys(SCALES).forEach(n => scaleSel.add(new Option(n, n)));
for (let o = 2; o <= 6; o++) octSel.add(new Option("C" + o, o));

rootSel.value  = state.root;
scaleSel.value = state.scale;
octSel.value   = state.octave;

rootSel.addEventListener("change",  e => { state.root   = Number(e.target.value); buildBoard(); });
scaleSel.addEventListener("change", e => { state.scale  = e.target.value;         buildBoard(); });
octSel.addEventListener("change",   e => { state.octave = Number(e.target.value); buildBoard(); });

// Selain vaatii käyttäjän eleen ennen kuin ääni saa soida.
document.addEventListener("pointerdown", wakeAudio, { once:true });

buildBoard();
</script>
</body>
</html>
