<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sävelluonnos</title>
<style>
  :root{
    --bg:#0E1116;
    --panel:#171B22;
    --line:#232A34;
    --key:#D8DEE6;
    --key-on:#F2C14E;
    --tonic:#6FD3C0;
    --rec:#E5484D;
    --ink:#0E1116;
    --text:#8D97A5;
    --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;margin:0;overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:var(--mono);
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  body{
    display:flex;flex-direction:column;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #bar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:5px 8px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  #bar label{
    display:flex;align-items:center;gap:4px;
    font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    white-space:nowrap;min-width:0;
  }
  select,button{
    font-family:var(--mono);
    background:#0B0E12;color:var(--key);
    border:1px solid var(--line);border-radius:5px;
    padding:5px 7px;font-size:12px;
  }
  select{appearance:none;-webkit-appearance:none;min-width:0;}
  #scale{max-width:150px;text-overflow:ellipsis;}
  button{cursor:pointer;white-space:nowrap;}
  button:disabled{opacity:.3;cursor:default;}
  select:focus-visible,button:focus-visible{outline:2px solid var(--tonic);outline-offset:1px;}

  #rec{
    margin-left:auto;
    border-color:var(--rec);color:var(--rec);
    font-weight:600;letter-spacing:.06em;
    display:flex;align-items:center;gap:6px;
  }
  #rec::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rec);}
  #rec.armed{background:var(--rec);color:#fff;border-color:var(--rec);}
  #rec.armed::before{background:#fff;border-color:#fff;}

  #octrow{
    flex:0 0 auto;
    display:flex;align-items:stretch;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  #octrow button{
    flex:0 0 auto;border:none;border-radius:0;background:transparent;
    padding:8px 24px;font-size:15px;line-height:1;color:var(--key);
  }
  #octrow button:active:not(:disabled){background:var(--line);}
  #octnow{
    flex:1 1 auto;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:12px;letter-spacing:.08em;color:var(--key);
    border-left:1px solid var(--line);border-right:1px solid var(--line);
  }
  #octnow b{font-weight:400;opacity:.45;}
  #octnow b.low{opacity:1;color:var(--tonic);}

  /* ---- nuottinauha: kaksi riviä, nuotit koko leveydeltä ---- */
  #strip{
    flex:0 0 auto;display:none;flex-direction:column;
    background:#0B0E12;
    border-bottom:1px solid var(--line);
  }
  #strip.show{display:flex;}

  #striptop{
    display:flex;align-items:stretch;gap:8px;
    padding:5px 8px 0;height:48px;
  }
  #count{
    flex:0 0 auto;align-self:center;
    font-size:10px;letter-spacing:.06em;color:var(--text);
  }
  #notes{
    flex:1 1 auto;min-width:0;
    display:flex;align-items:stretch;gap:2px;
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;
  }
  #notes::-webkit-scrollbar{display:none;}
  /* Koko nauhan korkuinen kosketuskohde: pystysuuntaan ei voi osua ohi. */
  #notes span.note{
    flex:0 0 auto;
    display:flex;align-items:center;
    padding:0 9px;border-radius:5px;
    font-size:14px;color:var(--key);
    cursor:pointer;
  }
  #notes span.note.sel{background:var(--line);color:var(--key-on);}
  #notes span.note.playing{color:var(--key-on);}
  #notes i.caret{
    flex:0 0 auto;width:2px;align-self:stretch;
    margin:4px 0;border-radius:1px;
    background:var(--tonic);
  }

  #stripbtns{
    display:flex;align-items:center;gap:6px;
    padding:6px 8px;
  }
  #stripbtns button{padding:7px 8px;font-size:12px;}
  #play{flex:0 0 52px;text-align:center;}
  #play.on{border-color:var(--key-on);color:var(--key-on);}
  #del,#clear,#export{flex:1 1 0;}
  #export{border-color:var(--tonic);color:var(--tonic);font-weight:600;}
  #export:disabled{border-color:var(--line);color:var(--key);}

  #board{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;gap:4px;
    padding:4px;touch-action:none;
  }
  .row{flex:1 1 0;min-height:0;display:flex;gap:4px;}
  .key{
    position:relative;
    flex:1 1 0;min-width:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    background:var(--key);color:var(--ink);
    border:none;border-radius:6px;padding:0;
  }
  .key.tonic{box-shadow:inset 0 0 0 3px var(--tonic);}
  .key.on{background:var(--key-on);}
  .degree{font-size:clamp(13px,2.6vh,24px);font-weight:600;line-height:1;}
  .name{font-size:clamp(8px,1.3vh,11px);letter-spacing:.05em;opacity:.6;line-height:1;}
  .kb{position:absolute;top:4px;right:6px;font-size:10px;font-weight:600;opacity:.3;line-height:1;}
  @media (pointer:coarse){ .kb{display:none;} }
</style>
</head>
<body>

<div id="bar">
  <label>Sävel <select id="root"></select></label>
  <label>Sävellaji <select id="scale"></select></label>
  <button id="rec" type="button">Nauhoita</button>
</div>

<div id="octrow">
  <button id="octdown" type="button" aria-label="Oktaavi alas">&#9660;</button>
  <span id="octnow"></span>
  <button id="octup" type="button" aria-label="Oktaavi ylös">&#9650;</button>
</div>

<div id="strip">
  <div id="striptop">
    <span id="count">0</span>
    <div id="notes"></div>
  </div>
  <div id="stripbtns">
    <button id="play"   type="button" aria-label="Toista" disabled>&#9654;</button>
    <button id="del"    type="button" disabled>Poista</button>
    <button id="clear"  type="button" disabled>Tyhjennä</button>
    <button id="export" type="button" disabled>Vie</button>
  </div>
</div>

<div id="board"></div>

<script>
"use strict";

/* ---------- sävelteoria ---------- */

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

const SCALES = {
  "Duuri":              [0,2,4,5,7,9,11],
  "Luonnollinen molli": [0,2,3,5,7,8,10],
  "Harmoninen molli":   [0,2,3,5,7,8,11],
  "Melodinen molli":    [0,2,3,5,7,9,11],
  "Doorinen":           [0,2,3,5,7,9,10],
  "Fryyginen":          [0,1,3,5,7,8,10],
  "Lyydinen":           [0,2,4,6,7,9,11],
  "Miksolyydinen":      [0,2,4,5,7,9,10],
  "Lokrinen":           [0,1,3,5,6,8,10],
  "Duuripentatoninen":  [0,2,4,7,9],
  "Mollipentatoninen":  [0,3,5,7,10],
  "Blues":              [0,3,5,6,7,10]
};

const KB_ROWS = [
  ["KeyQ","KeyW","KeyE","KeyR","KeyT","KeyY","KeyU"],
  ["KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyJ"],
  ["KeyZ","KeyX","KeyC","KeyV","KeyB","KeyN","KeyM"]
];

const ROWS    = 3;
const OCT_MIN = 1, OCT_MAX = 5;

const state = { root:0, scale:"Duuri", octave:3 };
const seq   = [];

// Kirjoituskohdistin. Sijaitsee nuottien VÄLISSÄ, kuten tekstissä:
// 0 = ennen ensimmäistä, seq.length = kaiken jälkeen.
let cursor = 0;

const midiToName = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

/* ---------- säilytys ---------- */

const STORE_KEY = "savelluonnos.v1";

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      seq: seq, root: state.root, scale: state.scale, octave: state.octave
    }));
  }catch(err){ /* täysi tai estetty tallennus: jatketaan ilman */ }
}

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(err){ return; }
  if (!raw) return;
  try{
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("muoto");

    // Jokainen arvo tarkistetaan erikseen: vioittunut tai muokattu
    // tallennus ei saa päätyä sellaisenaan käyttöön.
    if (Array.isArray(d.seq)){
      for (const m of d.seq){
        if (Number.isInteger(m) && m >= 0 && m <= 127) seq.push(m);
      }
    }
    if (Number.isInteger(d.root) && d.root >= 0 && d.root < 12) state.root = d.root;
    if (typeof d.scale === "string" && Object.prototype.hasOwnProperty.call(SCALES, d.scale)) state.scale = d.scale;
    if (Number.isInteger(d.octave) && d.octave >= OCT_MIN && d.octave <= OCT_MAX) state.octave = d.octave;
  }catch(err){
    seq.length = 0;
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  }
  cursor = seq.length;
}

/* ================================================================
   ÄÄNI

   Nuotti rakennetaan useasta siniaallosta, joilla on omat
   vaimenemisnopeutensa. Korkeat osaäänet katoavat ensin, joten
   ääni pehmenee soidessaan — se on ero staattiseen aaltomuotoon.
   ================================================================ */

let ac = null, master = null, noiseBuf = null;

const PARTIALS = [
  { mul:1, gain:1.00, decay:1.00 },
  { mul:2, gain:0.38, decay:0.58 },
  { mul:3, gain:0.17, decay:0.40 },
  { mul:4, gain:0.09, decay:0.28 },
  { mul:6, gain:0.04, decay:0.18 }
];

const INHARM  = 0.0004;   // kielen jäykkyys venyttää yläsävelet
const noteLen = m => Math.min(5.0, Math.max(0.7, 5.0 * Math.pow(2, -(m - 45) / 26)));

function wakeAudio(){
  if (!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 6;
    comp.attack.value = 0.004;
    comp.release.value = 0.20;

    master = ac.createGain();
    master.gain.value = 0.5;
    master.connect(comp).connect(ac.destination);

    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.05), ac.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  if (ac.state !== "running") ac.resume();
}

function voice(midi, at){
  const f0  = midiToFreq(midi);
  const dur = noteLen(midi);

  const out = ac.createGain();
  out.gain.setValueAtTime(0.0001, at);
  out.gain.linearRampToValueAtTime(1, at + 0.004);

  const lp = ac.createBiquadFilter();
  lp.type = "lowpass";
  lp.Q.value = 0.4;
  lp.frequency.setValueAtTime(Math.min(11000, f0 * 9), at);
  lp.frequency.exponentialRampToValueAtTime(Math.max(600, f0 * 2.5), at + dur * 0.55);

  out.connect(lp).connect(master);

  const nodes = [];

  for (const p of PARTIALS){
    const n       = p.mul;
    const stretch = n * Math.sqrt(1 + INHARM * n * n);
    const o = ac.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(f0 * stretch, at);

    const g = ac.createGain();
    g.gain.setValueAtTime(p.gain * 0.20, at);
    g.gain.setTargetAtTime(0.0001, at + 0.004, Math.max(0.05, dur * p.decay * 0.32));

    o.connect(g).connect(out);
    o.start(at);
    o.stop(at + dur + 0.3);
    nodes.push(o);
  }

  const nz = ac.createBufferSource();
  nz.buffer = noiseBuf;
  const bp = ac.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = Math.min(6000, f0 * 5);
  bp.Q.value = 0.8;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(0.09, at);
  ng.gain.exponentialRampToValueAtTime(0.0001, at + 0.035);
  nz.connect(bp).connect(ng).connect(out);
  nz.start(at);
  nz.stop(at + 0.06);
  nodes.push(nz);

  return { out, nodes };
}

let live = null, playingNote = null;

function noteOn(midi){
  wakeAudio();
  noteOff(0.12);
  live = voice(midi, ac.currentTime);
  playingNote = midi;
}

function noteOff(fade){
  if (!live) return;
  const t = ac.currentTime;
  const f = fade || 0.18;
  try{
    live.out.gain.cancelScheduledValues(t);
    live.out.gain.setValueAtTime(live.out.gain.value, t);
    live.out.gain.linearRampToValueAtTime(0.0001, t + f);
    for (const n of live.nodes){ try{ n.stop(t + f + 0.02); }catch(e){} }
  }catch(e){}
  live = null;
  playingNote = null;
}

// Kertasoitto ilman "elävän nuotin" tilaa: käytetään nauhaa napautettaessa.
function blip(midi){
  wakeAudio();
  voice(midi, ac.currentTime);
}

/* ---------- toisto ---------- */

const STEP = 0.25;

let voices = [], playT0 = 0, playRaf = 0, isPlaying = false;

function startPlay(){
  if (!seq.length) return;
  stopPlay();
  wakeAudio();
  noteOff(0.05);
  playT0 = ac.currentTime + 0.10;
  voices = seq.map((m, i) => voice(m, playT0 + i * STEP));
  isPlaying = true;
  playBtn.classList.add("on");
  playBtn.innerHTML = "&#9632;";
  playBtn.setAttribute("aria-label", "Pysäytä");
  tickPlay();
}

function stopPlay(){
  if (playRaf) cancelAnimationFrame(playRaf);
  playRaf = 0;
  if (voices.length && ac){
    const t = ac.currentTime;
    for (const v of voices){
      try{
        v.out.gain.cancelScheduledValues(t);
        v.out.gain.setValueAtTime(v.out.gain.value, t);
        v.out.gain.linearRampToValueAtTime(0.0001, t + 0.06);
        for (const n of v.nodes){ try{ n.stop(t + 0.08); }catch(e){} }
      }catch(e){}
    }
  }
  voices = [];
  if (!isPlaying) return;
  isPlaying = false;
  playBtn.classList.remove("on");
  playBtn.innerHTML = "&#9654;";
  playBtn.setAttribute("aria-label", "Toista");
  markPlay(-1);
}

function tickPlay(){
  const i = Math.floor((ac.currentTime - playT0) / STEP);
  if (i >= seq.length){ stopPlay(); return; }
  markPlay(i);
  playRaf = requestAnimationFrame(tickPlay);
}

function markPlay(i){
  const spans = notesEl.querySelectorAll("span.note");
  for (let k = 0; k < spans.length; k++) spans[k].classList.toggle("playing", k === i);
  if (i >= 0){
    const s = spans[i];
    if (s) s.scrollIntoView({ block:"nearest", inline:"nearest" });
    lightMidi(seq[i]);
  } else {
    lightMidi(null);
  }
}

/* ---------- nauha ja muokkaus ---------- */
// Toimii kuin tekstirivi: kohdistin on nuottien välissä, uudet nuotit
// syntyvät kohdistimen kohdalle ja Poista vie kohdistinta edeltävän.

let armed = false;

const stripEl  = document.getElementById("strip");
const notesEl  = document.getElementById("notes");
const countEl  = document.getElementById("count");
const recBtn   = document.getElementById("rec");
const playBtn  = document.getElementById("play");
const delBtn   = document.getElementById("del");
const clearBtn = document.getElementById("clear");
const expBtn   = document.getElementById("export");

function capture(midi){
  if (!armed) return;
  seq.splice(cursor, 0, midi);     // lisäys kohdistimen kohdalle, ei aina loppuun
  cursor++;
  drawSeq();
}

function deleteAtCursor(){
  if (cursor === 0) return;
  stopPlay();
  seq.splice(cursor - 1, 1);
  cursor--;
  drawSeq();
}

function drawSeq(){
  if (cursor > seq.length) cursor = seq.length;
  if (cursor < 0) cursor = 0;

  notesEl.textContent = "";
  let caretEl = null;

  for (let i = 0; i <= seq.length; i++){
    if (i === cursor){
      caretEl = document.createElement("i");
      caretEl.className = "caret";
      notesEl.append(caretEl);
    }
    if (i === seq.length) break;

    const s = document.createElement("span");
    s.className = "note" + (i === cursor - 1 ? " sel" : "");
    s.textContent = midiToName(seq[i]);
    s.dataset.i = i;
    notesEl.append(s);
  }

  if (!isPlaying && caretEl) caretEl.scrollIntoView({ block:"nearest", inline:"nearest" });

  countEl.textContent = seq.length;
  stripEl.classList.toggle("show", armed || seq.length > 0);
  const empty = seq.length === 0;
  playBtn.disabled  = empty;
  delBtn.disabled   = cursor === 0;
  clearBtn.disabled = empty;
  expBtn.disabled   = empty;
  saveState();
}

// Nauhan napautus etsii LÄHIMMÄN nuotin vaakasuunnassa, ei vaadi osumaa.
// Näin ohi painaminen ei enää hyppää loppuun.
notesEl.addEventListener("click", e => {
  stopPlay();
  const spans = notesEl.querySelectorAll("span.note");
  if (!spans.length){ cursor = 0; drawSeq(); return; }

  const x = e.clientX;
  const first = spans[0].getBoundingClientRect();
  if (x < first.left){ cursor = 0; drawSeq(); return; }   // ennen ensimmäistä

  let best = 0, bestD = Infinity;
  for (let i = 0; i < spans.length; i++){
    const r = spans[i].getBoundingClientRect();
    if (x >= r.left && x <= r.right){ best = i; bestD = 0; break; }
    const d = x < r.left ? r.left - x : x - r.right;
    if (d < bestD){ bestD = d; best = i; }
  }

  cursor = best + 1;
  blip(seq[best]);
  drawSeq();
});

recBtn.addEventListener("click", () => {
  armed = !armed;
  if (armed) stopPlay();
  recBtn.classList.toggle("armed", armed);
  recBtn.textContent = armed ? "Seis" : "Nauhoita";
  recBtn.blur();
  drawSeq();
});

playBtn.addEventListener("click", () => { isPlaying ? stopPlay() : startPlay(); playBtn.blur(); });
delBtn.addEventListener("click", () => { deleteAtCursor(); delBtn.blur(); });

clearBtn.addEventListener("click", () => {
  if (seq.length && !confirm("Tyhjennetäänkö " + seq.length + " nuottia?")) return;
  stopPlay();
  seq.length = 0;
  cursor = 0;
  drawSeq();
  clearBtn.blur();
});

/* ---------- MIDI-vienti ---------- */
// Standard MIDI File, formaatti 0, yksi raita.
// Kaikki nuotit samanmittaisia ja peräkkäin: soiton ajoitusta ei tallenneta.

const PPQ = 480, NOTE_TICKS = 240;

function vlq(n){
  const out = [n & 0x7F];
  n >>>= 7;
  while (n > 0){ out.unshift((n & 0x7F) | 0x80); n >>>= 7; }
  return out;
}

function buildMidi(notes){
  const trk = [];
  trk.push(0x00, 0xFF, 0x51, 0x03, 0x07, 0xA1, 0x20);   // tempo 120 BPM
  for (const m of notes){
    const p = Math.max(0, Math.min(127, m));
    trk.push(0x00, 0x90, p, 100);
    trk.push(...vlq(NOTE_TICKS), 0x80, p, 64);
  }
  trk.push(0x00, 0xFF, 0x2F, 0x00);

  const n = trk.length;
  return new Uint8Array([
    0x4D,0x54,0x68,0x64, 0,0,0,6,
    0,0, 0,1,
    (PPQ >> 8) & 0xFF, PPQ & 0xFF,
    0x4D,0x54,0x72,0x6B,
    (n >>> 24) & 0xFF, (n >>> 16) & 0xFF, (n >>> 8) & 0xFF, n & 0xFF,
    ...trk
  ]);
}

const slug = s => s.toLowerCase()
  .replace(/ä/g,"a").replace(/ö/g,"o")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function fileName(){
  const d = new Date();
  const p = x => String(x).padStart(2,"0");
  const stamp = p(d.getDate()) + p(d.getMonth()+1) + "-" + p(d.getHours()) + p(d.getMinutes());
  return "luonnos-" + slug(NOTE_NAMES[state.root]) + "-" + slug(state.scale) + "-" + stamp + ".mid";
}

async function exportMidi(){
  if (!seq.length) return;
  stopPlay();
  const bytes = buildMidi(seq);
  const name  = fileName();

  try{
    const file = new File([bytes], name, { type:"audio/midi" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:name });
      return;
    }
  }catch(err){
    if (err && err.name === "AbortError") return;
  }

  const url = URL.createObjectURL(new Blob([bytes], { type:"audio/midi" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

expBtn.addEventListener("click", () => { exportMidi(); expBtn.blur(); });

/* ---------- koskettimisto ---------- */

const board  = document.getElementById("board");
const octNow = document.getElementById("octnow");
const octUp  = document.getElementById("octup");
const octDn  = document.getElementById("octdown");

const codeToKey = new Map();

let lit = null;

function buildBoard(){
  const steps = SCALES[state.scale];
  board.textContent = "";
  codeToKey.clear();
  lit = null;

  let visRow = 0;                                   // 0 = ylin näkyvä rivi
  for (let row = ROWS - 1; row >= 0; row--, visRow++){
    const rowEl = document.createElement("div");
    rowEl.className = "row";
    steps.forEach((step, i) => {
      const midi = 12 * (state.octave + 1) + state.root + step + 12 * row;
      const key = document.createElement("button");
      key.className = "key" + (step === 0 ? " tonic" : "");
      key.dataset.midi = midi;
      key.type = "button";
      key.tabIndex = -1;

      const d = document.createElement("span");
      d.className = "degree"; d.textContent = i + 1;
      const n = document.createElement("span");
      n.className = "name"; n.textContent = midiToName(midi);
      key.append(d, n);

      // Sävellajissa voi olla 5, 6 tai 7 säveltä; ylimääräiset kirjaimet jäävät käyttämättä.
      const code = KB_ROWS[visRow] && KB_ROWS[visRow][i];
      if (code){
        codeToKey.set(code, key);
        const kb = document.createElement("span");
        kb.className = "kb"; kb.textContent = code.slice(3);
        key.append(kb);
      }
      rowEl.append(key);
    });
    board.append(rowEl);
  }

  octNow.textContent = "";
  for (let row = ROWS - 1; row >= 0; row--){
    const b = document.createElement("b");
    if (row === 0) b.className = "low";
    b.textContent = midiToName(12 * (state.octave + 1) + state.root + 12 * row);
    octNow.append(b);
  }

  octDn.disabled = state.octave <= OCT_MIN;
  octUp.disabled = state.octave >= OCT_MAX;
  saveState();
}

function shiftOctave(delta){
  const next = state.octave + delta;
  if (next < OCT_MIN || next > OCT_MAX) return;
  state.octave = next;
  release();
  allKeysUp();
  buildBoard();
}

octUp.addEventListener("click", () => { shiftOctave(+1); octUp.blur(); });
octDn.addEventListener("click", () => { shiftOctave(-1); octDn.blur(); });

function light(key){
  if (lit === key) return;
  if (lit) lit.classList.remove("on");
  if (key) key.classList.add("on");
  lit = key;
}

function lightMidi(midi){
  light(midi === null ? null : board.querySelector('.key[data-midi="' + midi + '"]'));
}

/* ---------- kosketus ---------- */

const keyAt = (x, y) => {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest(".key") : null;
};

let pressing = false;

board.addEventListener("pointerdown", e => {
  e.preventDefault();
  stopPlay();
  pressing = true;
  board.setPointerCapture(e.pointerId);
  strike(e.clientX, e.clientY);
});

board.addEventListener("pointermove", e => {
  if (pressing) strike(e.clientX, e.clientY);
});

function strike(x, y){
  const key = keyAt(x, y);
  if (!key) return;
  const midi = Number(key.dataset.midi);
  if (midi === playingNote) return;
  noteOn(midi);
  capture(midi);
  light(key);
}

function release(){
  if (!pressing) return;
  pressing = false;
  noteOff();
  light(null);
}
window.addEventListener("pointerup", release);
window.addEventListener("pointercancel", release);

/* ---------- fyysinen näppäimistö ---------- */

const held = [];

function keyDown(code){
  const key = codeToKey.get(code);
  if (!key || held.includes(code)) return;
  held.push(code);
  stopPlay();
  const midi = Number(key.dataset.midi);
  noteOn(midi);
  capture(midi);
  light(key);
}

function keyUp(code){
  const i = held.indexOf(code);
  if (i < 0) return;
  held.splice(i, 1);
  if (held.length){
    const key = codeToKey.get(held[held.length - 1]);
    if (key){
      const midi = Number(key.dataset.midi);
      if (midi !== playingNote){ noteOn(midi); light(key); }
      return;
    }
  }
  noteOff();
  light(null);
}

function allKeysUp(){
  held.length = 0;
  noteOff();
  light(null);
}

function auditionAtCursor(){
  if (cursor > 0 && cursor <= seq.length) blip(seq[cursor - 1]);
}

window.addEventListener("keydown", e => {
  if (e.repeat) return;                                   // pohjassa pito ei toista nuottia
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;

  if (e.code === "ArrowUp")    { e.preventDefault(); shiftOctave(+1); return; }
  if (e.code === "ArrowDown")  { e.preventDefault(); shiftOctave(-1); return; }

  // Nuolet sivuille siirtävät kohdistinta, kuten tekstissä.
  if (e.code === "ArrowLeft")  { e.preventDefault(); stopPlay(); cursor--; drawSeq(); auditionAtCursor(); return; }
  if (e.code === "ArrowRight") { e.preventDefault(); stopPlay(); cursor++; drawSeq(); auditionAtCursor(); return; }
  if (e.code === "Backspace")  { e.preventDefault(); deleteAtCursor(); return; }

  if (codeToKey.has(e.code))   { e.preventDefault(); keyDown(e.code); }
});

window.addEventListener("keyup", e => keyUp(e.code));

// Ikkunan menettäessä fokuksen mikään keyup ei tule perille — vapautetaan kaikki.
window.addEventListener("blur", () => { release(); allKeysUp(); });

/* ---------- ohjaimet ---------- */

const rootSel  = document.getElementById("root");
const scaleSel = document.getElementById("scale");

NOTE_NAMES.forEach((n, i) => rootSel.add(new Option(n, i)));
Object.keys(SCALES).forEach(n => scaleSel.add(new Option(n, n)));

rootSel.addEventListener("change",  e => { state.root  = Number(e.target.value); allKeysUp(); buildBoard(); e.target.blur(); });
scaleSel.addEventListener("change", e => { state.scale = e.target.value;         allKeysUp(); buildBoard(); e.target.blur(); });

document.addEventListener("pointerdown", wakeAudio, { once:true });

loadState();
rootSel.value  = state.root;
scaleSel.value = state.scale;
buildBoard();
drawSeq();
</script>
</body>
</html>
